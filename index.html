<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>과제 발표 투표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F3EE; --surface:#FFFFFF; --ink:#22201C; --ink-soft:#736C62; --ink-faint:#B5ADA1;
    --line:#E7E0D5; --accent:#E2573B; --accent-soft:#FCE6DF; --accent-ink:#5A1D10;
    --gold:#E7B530; --silver:#A9B2BC; --bronze:#C98A5A;
    --bar:#F0B9A9; --bar-top:#E2573B;
    --green:#2F6F4E; --green-bg:#E4F0E8; --warn:#8A5A00; --warn-bg:#FFF4D6;
    --font-body:'Noto Sans KR', sans-serif; --font-mono:'IBM Plex Mono', monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1B1A18; --surface:#262421; --ink:#F2EEE8; --ink-soft:#B2AA9E; --ink-faint:#776F65;
      --line:#38342F; --accent:#F07A5E; --accent-soft:#3E2620; --accent-ink:#FFD3C6;
      --bar:#6A3A2E; --bar-top:#F07A5E; --green:#8FD0A8; --green-bg:#23382C; --warn:#F5D68A; --warn-bg:#3A3220;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1B1A18; --surface:#262421; --ink:#F2EEE8; --ink-soft:#B2AA9E; --ink-faint:#776F65;
    --line:#38342F; --accent:#F07A5E; --accent-soft:#3E2620; --accent-ink:#FFD3C6;
    --bar:#6A3A2E; --bar-top:#F07A5E; --green:#8FD0A8; --green-bg:#23382C; --warn:#F5D68A; --warn-bg:#3A3220;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);}
  body{min-height:100vh;}
  button{font-family:inherit;}

  /* ---------- 공통 ---------- */
  .eyebrow{font-family:var(--font-mono);font-size:13px;letter-spacing:0.08em;color:var(--accent-ink);background:var(--accent-soft);display:inline-block;padding:6px 12px;border-radius:100px;}
  .avatar{flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;}
  .warn{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.5;}

  /* ---------- 투표 화면 ---------- */
  .vote-wrap{max-width:560px;margin:0 auto;padding:28px 16px 140px;}
  .vote-head{margin-bottom:20px;}
  .vote-head h1{font-size:clamp(24px,7vw,30px);font-weight:900;margin:14px 0 6px;line-height:1.3;}
  .vote-head p{font-size:16px;color:var(--ink-soft);margin:0;line-height:1.5;}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
  .cand{position:relative;background:var(--surface);border:2px solid transparent;border-radius:18px;padding:16px 14px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,0.04);transition:transform .12s, border-color .12s, box-shadow .12s;}
  .cand:active{transform:scale(0.98);}
  .cand.sel{border-color:var(--accent);box-shadow:0 6px 18px rgba(226,87,59,0.18);}
  .cand .num{position:absolute;top:12px;right:12px;font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--ink-faint);}
  .cand .avatar{width:44px;height:44px;font-size:18px;}
  .cand .who{font-size:17px;font-weight:700;line-height:1.25;}
  .cand .team{font-size:12.5px;color:var(--ink-soft);font-weight:500;margin-top:2px;}
  .cand .proj{font-size:14px;line-height:1.4;background:var(--bg);border-radius:10px;padding:8px 10px;font-weight:500;word-break:keep-all;}
  .cand .check{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:none;align-items:center;justify-content:center;font-size:15px;font-weight:900;}
  .cand.sel .check{display:flex;}
  .cand.sel .num{display:none;}

  .dock{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;justify-content:center;}
  .dock-inner{width:100%;max-width:560px;}
  .btn{width:100%;font-size:18px;font-weight:700;padding:17px;border-radius:14px;border:none;cursor:pointer;background:var(--ink);color:var(--surface);}
  .btn:disabled{background:var(--line);color:var(--ink-faint);cursor:default;}
  .btn.accent{background:var(--accent);color:#fff;}
  .btn-ghost{background:transparent;color:var(--ink-soft);font-weight:500;font-size:16px;padding:12px;margin-top:4px;width:100%;border:none;cursor:pointer;}
  .err{color:#B3261E;font-size:14px;text-align:center;margin-top:8px;}

  /* 확인 시트 */
  .sheet-bg{position:fixed;inset:0;background:rgba(20,18,15,0.45);display:flex;align-items:flex-end;justify-content:center;z-index:10;animation:fade .15s;}
  .sheet{width:100%;max-width:560px;background:var(--surface);border-radius:24px 24px 0 0;padding:26px 20px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease-out;text-align:center;}
  .sheet .avatar{width:72px;height:72px;font-size:28px;margin:0 auto 12px;}
  .sheet h2{font-size:24px;font-weight:900;margin:0 0 4px;}
  .sheet .team{color:var(--ink-soft);font-size:14px;margin-bottom:12px;}
  .sheet .proj{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:16px;font-weight:500;line-height:1.45;margin-bottom:14px;word-break:keep-all;}
  .sheet .note{font-size:14px;color:var(--ink-soft);margin-bottom:10px;}
  @keyframes fade{from{opacity:0}}
  @keyframes up{from{transform:translateY(40px);opacity:0}}

  /* 완료 화면 */
  .done{max-width:440px;margin:0 auto;padding:60px 16px;text-align:center;}
  .done .ring{width:96px;height:96px;border-radius:50%;background:var(--green-bg);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:900;margin:0 auto 20px;animation:pop .35s cubic-bezier(.2,1.6,.4,1);}
  @keyframes pop{from{transform:scale(0.4);opacity:0}}
  .done h1{font-size:28px;font-weight:900;margin:0 0 8px;}
  .done .sub{color:var(--ink-soft);font-size:16px;margin:0 0 26px;}
  .done .mine{background:var(--surface);border-radius:18px;padding:20px;display:flex;gap:14px;align-items:center;text-align:left;}
  .done .mine .avatar{width:54px;height:54px;font-size:22px;}
  .done .mine .who{font-size:18px;font-weight:700;}
  .done .mine .proj{font-size:14px;color:var(--ink-soft);margin-top:3px;line-height:1.4;}

  /* ---------- 결과 화면 (발표 화면용) ---------- */
  .res-wrap{max-width:1280px;margin:0 auto;padding:28px 24px 40px;display:grid;grid-template-columns:300px 1fr;gap:28px;align-items:start;}
  .side{position:sticky;top:24px;display:flex;flex-direction:column;gap:14px;}
  .side h1{font-size:28px;font-weight:900;line-height:1.3;margin:10px 0 0;}
  .side .sub{font-size:15px;color:var(--ink-soft);margin:0;line-height:1.5;}
  .panel{background:var(--surface);border-radius:20px;padding:20px;}
  .qr{text-align:center;}
  .qr .inner{display:inline-block;background:#fff;padding:12px;border-radius:12px;}
  .qr .cap{font-size:14px;color:var(--ink-soft);margin-top:10px;}
  .qr .url{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-faint);margin-top:4px;word-break:break-all;}
  .total .n{font-family:var(--font-mono);font-size:56px;font-weight:700;line-height:1;}
  .total .n small{font-size:20px;color:var(--ink-soft);font-weight:600;margin-left:4px;}
  .total .l{font-size:14px;color:var(--ink-soft);margin-top:6px;}
  .total .live{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);margin-top:10px;}
  .total .live i{width:8px;height:8px;border-radius:50%;background:var(--green);animation:blink 1.4s infinite;}
  @keyframes blink{50%{opacity:.25}}
  .reveal-btn{width:100%;font-size:17px;font-weight:700;padding:15px;border-radius:14px;border:none;cursor:pointer;background:var(--accent);color:#fff;}
  .reveal-btn.off{background:var(--surface);color:var(--ink-soft);border:1.5px solid var(--line);}

  .board{position:relative;background:var(--surface);border-radius:22px;padding:14px 18px;}
  .row{position:absolute;left:18px;right:18px;height:var(--rowH);display:grid;grid-template-columns:44px 46px minmax(0,1fr);gap:12px;align-items:center;transition:top .7s cubic-bezier(.3,.9,.3,1);}
  .row .rank{font-family:var(--font-mono);font-size:18px;font-weight:700;color:var(--ink-faint);text-align:center;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .row .rank.r1{background:var(--gold);color:#3D2C00;}
  .row .rank.r2{background:var(--silver);color:#20262C;}
  .row .rank.r3{background:var(--bronze);color:#3A1F0B;}
  .row .avatar{width:44px;height:44px;font-size:18px;}
  .row .body{min-width:0;}
  .row .line1{display:flex;align-items:baseline;gap:8px;min-width:0;}
  .row .who{font-size:18px;font-weight:700;white-space:nowrap;}
  .row .team{font-size:13px;color:var(--ink-faint);white-space:nowrap;}
  .row .proj{font-size:15px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
  .row .track{display:flex;align-items:center;gap:10px;margin-top:6px;}
  .row .bar-bg{flex:1;height:14px;background:var(--bg);border-radius:8px;overflow:hidden;}
  .row .bar{height:100%;width:0;background:var(--bar);border-radius:8px;transition:width .8s cubic-bezier(.3,.9,.3,1);}
  .row.top .bar{background:var(--bar-top);}
  .row .cnt{font-family:var(--font-mono);font-size:20px;font-weight:700;width:56px;text-align:right;}
  .row .cnt small{font-size:12px;color:var(--ink-soft);font-weight:600;margin-left:2px;}
  .board.hidden .bar{background:repeating-linear-gradient(45deg,var(--line) 0 6px,transparent 6px 12px);width:100% !important;}
  .board.hidden .cnt{color:var(--ink-faint);}

  @media (max-width: 860px){
    .res-wrap{grid-template-columns:1fr;padding:20px 16px 40px;}
    .side{position:static;}
    .row{grid-template-columns:34px 38px minmax(0,1fr);gap:9px;left:12px;right:12px;}
    .board{padding:10px 12px;}
    .row .avatar{width:38px;height:38px;font-size:15px;}
    .row .rank{width:30px;height:30px;font-size:15px;}
    .row .who{font-size:16px;}
    .row .team{display:none;}
    .row .proj{font-size:13px;}
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="data/candidates.js?v=1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const CFG = window.VOTE || {};
const CANDS = (CFG.candidates || []).map((c, i) => ({ id: i, name: c[0], team: c[1] || '', project: c[2] || '' }));
const PARAMS = new URLSearchParams(location.search);
const KEY = 'vote:' + (CFG.voteId || 'default');
const MINE_KEY = KEY + ':mine', DEVICE_KEY = KEY + ':device', DEMO_KEY = KEY + ':demo', REVEAL_KEY = KEY + ':reveal';
const root = document.getElementById('root');
if(CFG.title) document.title = CFG.title;

/* ---------- 유틸 ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function store(k, v){ try { if(v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch(e){ return null; } }
function hue(i){ return Math.round((i * 360 / Math.max(CANDS.length, 1) + 12) % 360); }
function avatar(c){ return `<div class="avatar" style="background:hsl(${hue(c.id)} 55% 52%)">${esc(c.name.trim().charAt(0) || '?')}</div>`; }
function deviceId(){
  let id = store(DEVICE_KEY);
  if(!id){
    id = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
    store(DEVICE_KEY, id);
  }
  return id;
}
function byName(name){ return CANDS.find(c => c.name === name); }

/* ---------- 서버 ---------- */
async function sendVote(choice){
  if(!CFG.voteUrl){
    const demo = store(DEMO_KEY) || [];
    demo.push(choice); store(DEMO_KEY, demo);
    return { ok: true, already: false, choice };
  }
  const res = await fetch(CFG.voteUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ device: deviceId(), choice })
  });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || '저장 실패');
  return data;
}
async function loadCounts(){
  if(PARAMS.has('demo')){ // 미리보기용 가짜 득표: ?result&demo
    const counts = {}; let total = 0;
    CANDS.forEach(c => { const n = (c.id * 7 + 3) % 9; counts[c.name] = n; total += n; });
    return { source: 'server', counts, total };
  }
  if(!CFG.voteUrl){
    const counts = {}; (store(DEMO_KEY) || []).forEach(n => counts[n] = (counts[n] || 0) + 1);
    return { source: 'local', counts, total: (store(DEMO_KEY) || []).length };
  }
  const res = await fetch(CFG.voteUrl, { cache: 'no-store' });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  return { source: 'server', counts: data.counts || {}, total: data.total || 0 };
}

/* ---------- 투표 화면 ---------- */
let selected = null;
function renderVote(){
  const mine = store(MINE_KEY);
  if(mine && byName(mine.name)) return renderDone(byName(mine.name), false);
  root.innerHTML = `
    <div class="vote-wrap">
      <div class="vote-head">
        <span class="eyebrow">VOTE · 1인 1표</span>
        <h1>${esc(CFG.title || '투표')}</h1>
        <p>${esc(CFG.subtitle || '한 사람을 골라 주세요')}</p>
      </div>
      ${CFG.voteUrl ? '' : '<div class="warn" style="margin-bottom:14px">연습 모드: 서버 주소가 없어 이 기기에만 기록됩니다.</div>'}
      <div class="grid">
        ${CANDS.map(c => `
          <button class="cand" data-id="${c.id}">
            <span class="num">${String(c.id + 1).padStart(2, '0')}</span>
            <span class="check">✓</span>
            <div style="display:flex;gap:10px;align-items:center">
              ${avatar(c)}
              <div><div class="who">${esc(c.name)}</div>${c.team ? `<div class="team">${esc(c.team)}</div>` : ''}</div>
            </div>
            <div class="proj">${esc(c.project)}</div>
          </button>`).join('')}
      </div>
    </div>
    <div class="dock"><div class="dock-inner"><button class="btn" id="goBtn" disabled>한 명을 선택하세요</button></div></div>`;
  root.querySelectorAll('.cand').forEach(el => el.onclick = () => {
    selected = CANDS[+el.dataset.id];
    root.querySelectorAll('.cand').forEach(x => x.classList.toggle('sel', x === el));
    const b = document.getElementById('goBtn');
    b.disabled = false; b.classList.add('accent');
    b.textContent = `${selected.name} 님에게 투표하기`;
  });
  document.getElementById('goBtn').onclick = () => selected && openConfirm(selected);
}
function openConfirm(c){
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = `
    <div class="sheet">
      ${avatar(c)}
      <h2>${esc(c.name)}</h2>
      ${c.team ? `<div class="team">${esc(c.team)}</div>` : ''}
      <div class="proj">${esc(c.project)}</div>
      <div class="note">투표는 한 번만 할 수 있고, 바꿀 수 없어요.</div>
      <button class="btn accent" id="okBtn">이 과제에 투표할게요</button>
      <button class="btn-ghost" id="noBtn">다시 고를게요</button>
      <div class="err" id="err"></div>
    </div>`;
  document.body.appendChild(bg);
  bg.onclick = e => { if(e.target === bg) bg.remove(); };
  bg.querySelector('#noBtn').onclick = () => bg.remove();
  const ok = bg.querySelector('#okBtn');
  ok.onclick = async () => {
    ok.disabled = true; ok.textContent = '보내는 중…';
    try {
      const r = await sendVote(c.name);
      const finalC = byName(r.choice) || c;
      store(MINE_KEY, { name: finalC.name, time: new Date().toISOString() });
      bg.remove();
      renderDone(finalC, r.already);
    } catch(e){
      ok.disabled = false; ok.textContent = '다시 시도';
      bg.querySelector('#err').textContent = '전송에 실패했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.';
    }
  };
}
function renderDone(c, already){
  root.innerHTML = `
    <div class="done">
      <div class="ring">✓</div>
      <h1>${already ? '이미 투표하셨어요' : '투표 완료!'}</h1>
      <p class="sub">${already ? '이 기기에서는 처음 고른 표만 반영됩니다.' : '소중한 한 표 감사합니다. 결과는 화면에서 함께 확인해요.'}</p>
      <div class="mine">${avatar(c)}<div><div class="who">${esc(c.name)}</div><div class="proj">${esc(c.project)}</div></div></div>
    </div>`;
}

/* ---------- 결과 화면 ---------- */
let revealed = PARAMS.has('reveal') || store(REVEAL_KEY) === true;
let lastData = { counts: {}, total: 0, source: 'local' };
function renderResultShell(){
  const qrUrl = CFG.qrUrl || (location.origin + location.pathname);
  root.innerHTML = `
    <div class="res-wrap">
      <aside class="side">
        <div><span class="eyebrow">LIVE RESULT</span><h1>${esc(CFG.title || '투표')}</h1></div>
        <p class="sub">${esc(CFG.subtitle || '')}</p>
        <div class="panel qr"><div class="inner" id="qrBox"></div><div class="cap">휴대폰 카메라로 찍고 투표하세요</div><div class="url">${esc(qrUrl)}</div></div>
        <div class="panel total"><div class="n" id="totalN">0<small>표</small></div><div class="l">지금까지 참여한 인원</div><div class="live"><i></i>5초마다 자동 갱신</div></div>
        <button class="reveal-btn" id="revealBtn"></button>
        <div id="srcWarn"></div>
      </aside>
      <main class="board" id="board"></main>
    </div>`;
  if(window.QRCode) new QRCode(document.getElementById('qrBox'), { text: qrUrl, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
  const board = document.getElementById('board');
  board.innerHTML = CANDS.map(c => `
    <div class="row" id="row${c.id}">
      <div class="rank"></div>
      ${avatar(c)}
      <div class="body">
        <div class="line1"><span class="who">${esc(c.name)}</span><span class="team">${esc(c.team)}</span><span class="proj" title="${esc(c.project)}">${esc(c.project)}</span></div>
        <div class="track"><div class="bar-bg"><div class="bar"></div></div><div class="cnt"></div></div>
      </div>
    </div>`).join('');
  const btn = document.getElementById('revealBtn');
  btn.onclick = () => { revealed = !revealed; store(REVEAL_KEY, revealed); paintResult(); };
}
function paintResult(){
  const { counts, total, source } = lastData;
  const rowH = window.innerWidth <= 860 ? 68 : 74;
  const board = document.getElementById('board');
  board.style.setProperty('--rowH', rowH + 'px');
  board.style.height = (CANDS.length * rowH + 28) + 'px';
  board.classList.toggle('hidden', !revealed);
  document.getElementById('totalN').innerHTML = `${total}<small>표</small>`;
  const btn = document.getElementById('revealBtn');
  btn.textContent = revealed ? '결과 가리기' : '결과 공개하기';
  btn.classList.toggle('off', revealed);
  document.getElementById('srcWarn').innerHTML = source === 'server' ? '' :
    `<div class="warn">${CFG.voteUrl ? '서버 연결 실패 — 다시 시도 중입니다.' : '연습 모드: 이 기기에서 한 투표만 보입니다.'}</div>`;

  const list = CANDS.map(c => ({ c, n: counts[c.name] || 0 }));
  const order = revealed ? [...list].sort((a, b) => b.n - a.n || a.c.id - b.c.id) : list;
  const max = Math.max(1, ...list.map(x => x.n));
  let rank = 0, prev = null;
  order.forEach((x, i) => {
    if(x.n !== prev){ rank = i + 1; prev = x.n; }
    const row = document.getElementById('row' + x.c.id);
    row.style.top = (14 + i * rowH) + 'px';
    const rk = row.querySelector('.rank');
    rk.className = 'rank' + (revealed && x.n > 0 && rank <= 3 ? ' r' + rank : '');
    rk.textContent = revealed ? rank : String(x.c.id + 1).padStart(2, '0');
    row.classList.toggle('top', revealed && x.n > 0 && x.n === max);
    row.querySelector('.bar').style.width = revealed ? (x.n / max * 100) + '%' : '0';
    row.querySelector('.cnt').innerHTML = revealed ? `${x.n}<small>표</small>` : '?';
  });
}
async function tick(){
  try { lastData = await loadCounts(); }
  catch(e){ lastData = { ...lastData, source: 'error' }; }
  paintResult();
}
function startResult(){
  renderResultShell();
  paintResult();
  tick();
  setInterval(tick, 5000);
  window.addEventListener('resize', paintResult);
}

/* ---------- 시작 ---------- */
if(PARAMS.has('result') || PARAMS.has('admin')) startResult();
else renderVote();
</script>
