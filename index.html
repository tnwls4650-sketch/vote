<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인사팀 AI 활용 우수작 선정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* ---------- 관리자 화면(밝은 톤) 기본 토큰 ---------- */
  :root{
    --bg:#F6F3EE; --surface:#FFFFFF; --ink:#22201C; --ink-soft:#736C62; --ink-faint:#B5ADA1;
    --line:#E7E0D5; --accent:#B8893A; --accent-soft:#F6EBD3; --accent-ink:#5A4110; --on-accent:#FFFFFF;
    --warn:#8A5A00; --warn-bg:#FFF4D6; --danger:#B3261E;
    /* 모던 산세리프(Pretendard) 하나로 통일 — 예전 serif/mono 자리도 같은 글꼴 */
    --font-body:'Pretendard Variable', Pretendard, 'Noto Sans KR', sans-serif; --font-serif:var(--font-body); --font-mono:var(--font-body);
    --gold-1:#FFF1C9; --gold-2:#E6C574; --gold-3:#B8893A;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1B1A18; --surface:#262421; --ink:#F2EEE8; --ink-soft:#B2AA9E; --ink-faint:#776F65;
      --line:#38342F; --accent:#D6B25E; --accent-soft:#3A3122; --accent-ink:#F3DFA8; --on-accent:#1A1407;
      --warn:#F5D68A; --warn-bg:#3A3220; --danger:#FF8A80;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1B1A18; --surface:#262421; --ink:#F2EEE8; --ink-soft:#B2AA9E; --ink-faint:#776F65;
    --line:#38342F; --accent:#D6B25E; --accent-soft:#3A3122; --accent-ink:#F3DFA8; --on-accent:#1A1407;
    --warn:#F5D68A; --warn-bg:#3A3220; --danger:#FF8A80;
  }
  /* ---------- 참가자 화면: 시상식 톤(어두운 바탕 + 골드) ---------- */
  html.mode-vote{
    --bg:#0C0D12; --surface:#16181F; --ink:#F3EEE4; --ink-soft:#A9A293; --ink-faint:#6F695E;
    --line:#2A2C36; --accent:#D6B25E; --accent-soft:rgba(214,178,94,.14); --accent-ink:#EBD9A8; --on-accent:#1A1407;
    --warn:#F5D68A; --warn-bg:#2E2817;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);}
  body{min-height:100vh;}
  button,input,textarea{font-family:inherit;}
  a{color:inherit;}
  .gold{background:linear-gradient(180deg,var(--gold-1) 0%,var(--gold-2) 48%,var(--gold-3) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .serif{font-family:var(--font-serif);}

  /* ================= 캐릭터 'AI 대리' (회사원) ================= */
  .mascot{display:flex;align-items:flex-end;gap:16px;--ms:150px;}
  .mascot svg{width:var(--ms);height:auto;flex:none;overflow:visible;}
  .mascot[data-layout="stack"]{flex-direction:column-reverse;align-items:center;gap:6px;}
  .m-arm-talk,.m-stick,.m-mouth,.m-eyes,.m-jump{transform-box:fill-box;}
  .m-arm-talk{transform-origin:top right;}
  .m-stick-l{transform-origin:top left;} .m-stick-r{transform-origin:top right;}
  .m-mouth{transform-origin:center top;} .m-eyes{transform-origin:center;}
  .m-arms-cheer,.m-arms-drum,.m-drum{display:none;}
  .mascot .m-jump{animation:m-bob 2.6s ease-in-out infinite;}
  .m-eyes{animation:m-blink 4.4s infinite;}
  @keyframes m-bob{50%{transform:translateY(-4px)}}
  @keyframes m-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
  .mascot.talk .m-mouth{animation:m-talk .24s ease-in-out infinite alternate;}
  .mascot.talk .m-arm-talk{animation:m-gesture .7s ease-in-out infinite alternate;}
  @keyframes m-talk{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
  @keyframes m-gesture{from{transform:rotate(0deg)}to{transform:rotate(28deg)}}
  .mascot.cheer .m-arms-idle{display:none;} .mascot.cheer .m-arms-cheer{display:inline;}
  .mascot.cheer .m-jump{animation:m-jump .42s ease-in-out infinite alternate;}
  @keyframes m-jump{to{transform:translateY(-14px)}}
  .mascot.drum .m-arms-idle{display:none;} .mascot.drum .m-arms-drum,.mascot.drum .m-drum{display:inline;}
  .mascot.drum .m-stick-l{animation:m-stl .13s infinite alternate;}
  .mascot.drum .m-stick-r{animation:m-str .13s infinite alternate .065s;}
  .mascot.drum .m-jump{animation:m-shake .11s infinite alternate;}
  @keyframes m-stl{from{transform:rotate(-18deg)}to{transform:rotate(8deg)}}
  @keyframes m-str{from{transform:rotate(18deg)}to{transform:rotate(-8deg)}}
  @keyframes m-shake{to{transform:translate(1.2px,1px)}}
  .m-bubble{display:none;position:relative;background:#FBF6EA;color:#221C10;border-radius:18px;padding:13px 19px;font-weight:700;line-height:1.5;font-size:var(--bfs,16px);max-width:min(560px,62vw);margin-bottom:calc(var(--ms) * .62);box-shadow:0 10px 30px rgba(0,0,0,.35);word-break:keep-all;border:1px solid rgba(214,178,94,.5);}
  .m-bubble:not(:empty){display:block;}
  .m-bubble::before{content:'';position:absolute;left:-10px;bottom:20px;border:10px solid transparent;border-right-color:#FBF6EA;border-left:0;}
  .mascot[data-layout="stack"] .m-bubble{margin-bottom:0;max-width:300px;text-align:center;}
  .mascot[data-layout="stack"] .m-bubble::before{left:50%;bottom:-10px;margin-left:-10px;border:10px solid transparent;border-top-color:#FBF6EA;border-bottom:0;}
  .m-bubble.pop{animation:m-pop .35s cubic-bezier(.2,1.5,.4,1);}
  @keyframes m-pop{from{transform:scale(.75);opacity:0}}

  /* ================= 공통 (투표·관리) ================= */
  .eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:0.16em;color:var(--accent-ink);background:var(--accent-soft);display:inline-block;padding:6px 12px;border-radius:100px;}
  .avatar{flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-family:var(--font-serif);}
  .warn{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.5;}
  .btn{display:block;width:100%;text-align:center;text-decoration:none;font-size:17px;font-weight:700;padding:16px;border-radius:14px;border:none;cursor:pointer;background:var(--ink);color:var(--surface);}
  .btn:disabled{background:var(--line);color:var(--ink-faint);cursor:default;}
  .btn.accent{background:linear-gradient(180deg,#F1D58A,#C99A45);color:#1A1407;}
  .btn.line{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
  .btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--line);}
  .btn.danger.armed{background:var(--danger);color:#fff;border-color:var(--danger);}
  .btn-ghost{background:transparent;color:var(--ink-soft);font-weight:500;font-size:16px;padding:12px;margin-top:4px;width:100%;border:none;cursor:pointer;}
  .err{color:var(--danger);font-size:14px;text-align:center;margin-top:8px;min-height:1em;}
  .center-msg{max-width:440px;margin:0 auto;padding:56px 16px;text-align:center;}
  .center-msg h1{font-family:var(--font-serif);font-size:26px;font-weight:900;margin:18px 0 8px;}
  .center-msg p{color:var(--ink-soft);font-size:16px;margin:0;line-height:1.6;}

  /* ================= 참가자 투표 화면 ================= */
  .vote-wrap{max-width:560px;margin:0 auto;padding:24px 16px 140px;}
  .vote-head{display:flex;gap:12px;align-items:flex-end;margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid rgba(214,178,94,.25);}
  .vote-head .mascot{--ms:92px;}
  .vote-head .m-bubble{font-size:14px;padding:8px 12px;max-width:170px;}
  .vote-head h1{font-family:var(--font-serif);font-size:clamp(22px,6.4vw,28px);font-weight:900;margin:12px 0 6px;line-height:1.3;word-break:keep-all;}
  .vote-head p{font-size:14.5px;color:var(--ink-soft);margin:0;line-height:1.5;}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
  .cand{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:15px 13px 13px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;color:var(--ink);transition:transform .12s, border-color .12s, box-shadow .12s;}
  .cand:active{transform:scale(0.98);}
  .cand.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 8px 24px rgba(214,178,94,0.18);}
  .cand .num{position:absolute;top:12px;right:12px;font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--ink-faint);}
  .cand .avatar{width:40px;height:40px;font-size:16px;}
  .cand .who{font-size:16.5px;font-weight:700;line-height:1.25;}
  .cand .team{font-size:12px;color:var(--ink-soft);font-weight:500;margin-top:2px;}
  .cand .proj{font-size:13.5px;line-height:1.45;background:rgba(214,178,94,.07);border-radius:10px;padding:8px 10px;font-weight:500;word-break:keep-all;color:var(--ink);}
  .cand .check{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#1A1407;display:none;align-items:center;justify-content:center;font-size:14px;font-weight:900;}
  .cand.sel .check{display:flex;} .cand.sel .num{display:none;}
  .dock{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;justify-content:center;}
  .dock-inner{width:100%;max-width:560px;}
  .wait-dots i{display:inline-block;animation:dot 1.2s infinite;font-style:normal;}
  .wait-dots i:nth-child(2){animation-delay:.2s} .wait-dots i:nth-child(3){animation-delay:.4s}
  @keyframes dot{0%,60%,100%{opacity:.25}30%{opacity:1}}
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:flex-end;justify-content:center;z-index:10;animation:fade .15s;}
  .sheet{width:100%;max-width:560px;background:var(--surface);border-radius:24px 24px 0 0;border-top:1px solid rgba(214,178,94,.4);padding:26px 20px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease-out;text-align:center;}
  .sheet .avatar{width:68px;height:68px;font-size:26px;margin:0 auto 12px;}
  .sheet h2{font-family:var(--font-serif);font-size:24px;font-weight:900;margin:0 0 4px;}
  .sheet .team{color:var(--ink-soft);font-size:14px;margin-bottom:12px;}
  .sheet .proj{background:rgba(214,178,94,.08);border:1px solid rgba(214,178,94,.25);border-radius:12px;padding:12px 14px;font-size:16px;font-weight:500;line-height:1.45;margin-bottom:14px;word-break:keep-all;}
  .sheet .note{font-size:14px;color:var(--ink-soft);margin-bottom:10px;}
  @keyframes fade{from{opacity:0}}
  @keyframes up{from{transform:translateY(40px);opacity:0}}
  .done{max-width:440px;margin:0 auto;padding:40px 16px;text-align:center;}
  .done .mascot{--ms:165px;justify-content:center;}
  .done h1{font-family:var(--font-serif);font-size:28px;font-weight:900;margin:18px 0 8px;}
  .done .sub{color:var(--ink-soft);font-size:16px;margin:0 0 22px;line-height:1.5;}
  .done .mine{background:var(--surface);border:1px solid rgba(214,178,94,.3);border-radius:18px;padding:18px;display:flex;gap:14px;align-items:center;text-align:left;}
  .done .mine .avatar{width:50px;height:50px;font-size:20px;}
  .done .mine .who{font-size:18px;font-weight:700;}
  .done .mine .proj{font-size:14px;color:var(--ink-soft);margin-top:3px;line-height:1.4;}

  /* ================= 관리자 화면 ================= */
  .ad-wrap{max-width:760px;margin:0 auto;padding:28px 16px 120px;}
  .ad-wrap.narrow{max-width:400px;padding-top:60px;}
  .ad-wrap h1{font-size:28px;font-weight:900;margin:12px 0 6px;}
  .ad-sub{color:var(--ink-soft);margin:0 0 20px;}
  .ad-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;}
  .link{background:none;border:none;color:var(--ink-soft);font-size:15px;cursor:pointer;text-decoration:underline;}
  .ad-card{background:var(--surface);border-radius:20px;padding:22px 20px;margin-bottom:14px;}
  .ad-card h2{font-size:18px;margin:0 0 14px;display:flex;align-items:center;gap:8px;}
  .ad-card h2 small{font-family:var(--font-mono);font-size:13px;color:var(--ink-soft);font-weight:600;background:var(--bg);border-radius:100px;padding:3px 10px;}
  .ad-in,.ad-row input,textarea{width:100%;font-size:16px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);outline:none;}
  .ad-in:focus,.ad-row input:focus,textarea:focus{border-color:var(--accent);}
  .ad-wrap.narrow .ad-in{font-size:20px;text-align:center;letter-spacing:.3em;margin-bottom:10px;}
  .ad-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .ad-fields label{font-size:13px;color:var(--ink-soft);font-weight:500;display:flex;flex-direction:column;gap:6px;}
  .ad-fields .full{grid-column:1/-1;}
  .ad-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
  .ad-stats div{background:var(--bg);border-radius:14px;padding:14px;}
  .ad-stats b{display:block;font-size:22px;font-weight:900;}
  .ad-stats span{font-size:13px;color:var(--ink-soft);}
  .ad-links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  .ad-note{font-size:13px;color:var(--ink-soft);margin-top:8px;line-height:1.5;}
  .ad-row{display:grid;grid-template-columns:30px 1fr 1fr 36px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
  .ad-row .n{font-family:var(--font-mono);font-size:13px;color:var(--ink-faint);font-weight:600;text-align:center;}
  .ad-row .proj{grid-column:2/4;}
  .ad-row .del{width:36px;height:36px;border-radius:10px;border:none;background:var(--bg);color:var(--ink-soft);font-size:18px;cursor:pointer;}
  .ad-row input{padding:10px 12px;font-size:15px;}
  details.paste{background:var(--bg);border-radius:14px;padding:12px 14px;margin-bottom:10px;}
  details.paste summary{cursor:pointer;font-weight:700;font-size:15px;}
  details.paste p{font-size:13px;color:var(--ink-soft);margin:8px 0;}
  details.paste textarea{background:var(--surface);font-size:14px;margin-bottom:8px;}
  .ad-save{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;justify-content:center;}
  .ad-save-in{width:100%;max-width:760px;display:flex;gap:12px;align-items:center;}
  .ad-save-in span{flex:1;font-size:14px;color:var(--ink-soft);}
  .ad-save-in .btn{width:auto;padding:15px 34px;}
  .qr-mini{display:flex;gap:16px;align-items:center;background:var(--bg);border-radius:14px;padding:12px;margin-bottom:12px;}
  .qr-mini .q{background:#fff;padding:6px;border-radius:8px;flex:none;}
  .qr-mini .u{font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);word-break:break-all;}
  @media (max-width:560px){ .ad-fields{grid-template-columns:1fr;} .ad-links{grid-template-columns:1fr;} }

  /* ================= 발표 화면 (시상식 무대) ================= */
  html.mode-result,body.mode-result{background:#07080C;}
  .stage{position:relative;height:100vh;min-height:560px;overflow:hidden;color:#F4EEE2;display:grid;grid-template-rows:auto 1fr auto;
    background:
      radial-gradient(ellipse 55% 50% at 50% -4%, rgba(230,197,116,.22), transparent 70%),
      radial-gradient(ellipse 90% 35% at 50% 108%, rgba(230,197,116,.14), transparent 70%),
      linear-gradient(180deg,#0D0E15 0%,#07080C 100%);}
  .beam{position:absolute;top:-12%;width:30vw;height:125%;pointer-events:none;z-index:0;transform-origin:top center;
    background:linear-gradient(180deg,rgba(255,238,196,.17),rgba(255,238,196,0) 78%);clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);filter:blur(6px);}
  .beam.l{left:4%;animation:sweepL 10s ease-in-out infinite alternate;}
  .beam.r{right:4%;animation:sweepR 12s ease-in-out infinite alternate;}
  @keyframes sweepL{from{transform:rotate(-20deg)}to{transform:rotate(12deg)}}
  @keyframes sweepR{from{transform:rotate(20deg)}to{transform:rotate(-12deg)}}
  .stage.focus .beam.l{animation:none;transform:rotate(14deg);transition:transform 1.2s;}
  .stage.focus .beam.r{animation:none;transform:rotate(-14deg);transition:transform 1.2s;}
  .floor{position:absolute;left:0;right:0;bottom:0;height:16vh;background:linear-gradient(180deg,transparent,rgba(214,178,94,.06));border-top:1px solid rgba(214,178,94,.12);pointer-events:none;}
  #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;}
  .st-top{display:flex;justify-content:space-between;align-items:center;padding:18px 32px;position:relative;z-index:2;}
  .brand{display:flex;align-items:center;gap:14px;}
  .brand .mark{font-family:var(--font-mono);font-size:12px;letter-spacing:.32em;color:#D6B25E;}
  .brand .rule{width:42px;height:1px;background:linear-gradient(90deg,#D6B25E,transparent);}
  .brand .ttl{font-family:var(--font-serif);font-weight:700;font-size:clamp(14px,1.3vw,18px);color:#E8DCC0;opacity:.85;}
  .st-tools{display:flex;gap:8px;}
  .pill{background:transparent;border:1px solid rgba(214,178,94,.35);color:#E8DCC0;border-radius:100px;padding:7px 14px;font-size:13px;cursor:pointer;text-decoration:none;}
  .st-main{position:relative;display:flex;align-items:center;justify-content:center;padding:0 32px;min-height:0;z-index:1;}
  .st-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:0 32px 20px;position:relative;z-index:6;}
  .stage{--hostms:clamp(150px,min(17vw,32vh),310px);}
  .st-host .mascot{--ms:var(--hostms);--bfs:clamp(19px,min(2.1vw,3.6vh),34px);}
  .st-host .m-bubble{padding:.75em 1.15em;border-radius:24px;max-width:min(900px,66vw);}
  .st-ctrl{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;align-items:center;}
  .btn-st{background:linear-gradient(180deg,#F3DA94,#C99A45);color:#1A1407;font-weight:800;font-size:clamp(15px,1.25vw,19px);padding:15px 30px;border-radius:100px;border:none;cursor:pointer;text-decoration:none;letter-spacing:.02em;box-shadow:0 10px 30px rgba(201,154,69,.25);}
  .btn-st.ghost{background:transparent;color:#EBD9A8;border:1px solid rgba(214,178,94,.45);box-shadow:none;font-weight:600;}
  .btn-st:disabled{opacity:.5;cursor:default;}
  .hint{font-size:13px;color:rgba(235,217,168,.55);margin-right:6px;letter-spacing:.04em;}
  .st-pin{display:flex;gap:8px;align-items:center;}
  .st-pin input{width:150px;font-size:18px;padding:13px;border-radius:100px;border:1px solid rgba(214,178,94,.5);background:rgba(255,255,255,.06);color:#fff;text-align:center;letter-spacing:.3em;}
  .st-err{color:#FFB4A9;font-size:14px;}
  .enter{animation:enter .7s cubic-bezier(.2,.9,.3,1) both;}
  @keyframes enter{from{opacity:0;transform:translateY(18px);filter:blur(4px)}}
  .kicker{font-family:var(--font-mono);font-size:clamp(11px,1vw,14px);letter-spacing:.36em;color:#D6B25E;text-transform:uppercase;}
  .divider{display:flex;align-items:center;gap:14px;justify-content:center;color:#D6B25E;margin:1.6vh 0;}
  .divider::before,.divider::after{content:'';width:min(120px,12vw);height:1px;background:linear-gradient(90deg,transparent,#D6B25E);}
  .divider::after{transform:scaleX(-1);}
  .divider i{width:7px;height:7px;transform:rotate(45deg);background:#D6B25E;display:block;}

  .lobby{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5vw;align-items:center;width:100%;max-width:1240px;}
  .big-title{font-family:var(--font-serif);font-size:clamp(28px,min(4vw,7.5vh),76px);font-weight:800;line-height:1.2;margin:0 0 1.6vh;white-space:nowrap;}
  .lb-sub{font-size:clamp(16px,min(1.6vw,2.6vh),24px);color:#CFC4AC;margin-bottom:3vh;}
  .chips{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:clamp(6px,.7vw,10px);max-width:880px;}

<body>
<div id="root"></div>

<script src="data/candidates.js?v=5"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ================================================================
   설정 · 유틸
   ================================================================ */
const CFG = window.VOTE || {};
const P = new URLSearchParams(location.search);
const MODE = P.has('admin') ? 'admin' : (P.has('result') ? 'result' : 'vote');
const NS = 'vote2:' + (CFG.voteUrl ? CFG.voteUrl.slice(-16) : 'local') + ':';
const PIN_KEY = NS + 'pin';
const HOST = 'AI 대리';
// 선정 기준 [이름, 설명] — data/candidates.js의 criteria로 바꿀 수 있음
const CRITERIA = (CFG.criteria && CFG.criteria.length) ? CFG.criteria : [
  ['효과성', '업무 효율화 및 생산성 향상'],
  ['참신함', '새로운 아이디어'],
  ['현업 적용', '실제 업무에 반복 활용되는 정도'],
  ['확산 가능성', '개인·팀·회사에 기여할 수 있는지'],
  ['완성도', '디자인, 일관된 결과 등']
];
const root = document.getElementById('root');
document.documentElement.classList.add('mode-' + MODE);
document.body.classList.add('mode-' + MODE);

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
let CAND_N = 13;
function hueColor(i){ return `hsl(${Math.round((i * 360 / Math.max(CAND_N, 1) + 30) % 360)} 32% 42%)`; }
function initial(name){ return esc(String(name).trim().charAt(0) || '?'); }
function avatar(c, i){ return `<div class="avatar" style="background:${hueColor(i)}">${initial(c.name)}</div>`; }
function voterUrl(){ return CFG.qrUrl || (location.origin + location.pathname); }
function drawQR(id, size){
  const el = document.getElementById(id);
  if(!el || !window.QRCode) return;
  el.innerHTML = '';
  new QRCode(el, { text: voterUrl(), width: size, height: size, colorDark: '#1A1407', colorLight: '#FBF8F0', correctLevel: QRCode.CorrectLevel.M });
}
// 제목을 한 줄에 맞춤: 넘치면 글자 크기를 줄임
function fitOneLine(el, maxPx, minPx){
  if(!el) return;
  el.style.whiteSpace = 'nowrap';
  let s = Math.round(maxPx); el.style.fontSize = s + 'px';
  while(el.scrollWidth > el.clientWidth + 1 && s > minPx){ s--; el.style.fontSize = s + 'px'; }
}
let onFit = null;
window.addEventListener('resize', () => onFit && onFit());
function deviceId(){
  let id = LS.get(NS + 'device', '');
  if(!id){ id = crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2); LS.set(NS + 'device', id); }
  return id;
}

/* ================================================================
   저장소 (구글 시트 / 없으면 이 브라우저 연습 모드)
   ================================================================ */
const DEFAULTS = { title: '인사팀 AI 활용 우수작 선정', subtitle: '가장 인상 깊었던 AI 활용 사례에 한 표를 주세요', status: 'ready', round: '1', voteSeconds: '60', countdownSeconds: '5', runoff: '' };
// 결선 투표 중이면 동점자 이름 목록, 아니면 빈 배열
function runoffNames(st){ return String((st && st.config && st.config.runoff) || '').split('|').filter(Boolean); }
// 지금 투표 대상: 결선 중이면 동점자만, 아니면 전체 명단
function activeCands(st){ const r = runoffNames(st); return r.length ? st.candidates.filter(c => r.includes(c.name)) : st.candidates; }
const api = CFG.voteUrl ? {
  async state(){
    const r = await fetch(CFG.voteUrl + '?t=' + Date.now(), { cache: 'no-store' });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  },
  async post(body){
    const r = await fetch(CFG.voteUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }
} : (() => {
  const K = NS + 'mockdb', PIN = '0000';
  const load = () => LS.get(K, null) || { settings: { ...DEFAULTS }, candidates: [], votes: [] };
  const stateOf = db => {
    const counts = {}; let total = 0;
    db.votes.filter(v => v.round === db.settings.round).forEach(v => { counts[v.choice] = (counts[v.choice] || 0) + 1; total++; });
    return { ok: true, config: { ...db.settings }, candidates: db.candidates, counts, total };
  };
  return {
    async state(){ return stateOf(load()); },
    async post(b){
      const db = load(), s = db.settings;
      if(b.action === 'vote'){
        if(s.status !== 'open') return { ok: false, error: 'not_open', status: s.status };
        const prev = db.votes.find(v => v.round === s.round && v.device === b.device);
        if(prev) return { ok: true, already: true, choice: prev.choice };
        if(!activeCands({ config: s, candidates: db.candidates }).some(c => c.name === b.choice)) return { ok: false, error: 'unknown candidate' };
        db.votes.push({ round: s.round, device: b.device, choice: b.choice }); LS.set(K, db);
        return { ok: true, already: false, choice: b.choice };
      }
      if(String(b.pin) !== PIN) return { ok: false, error: 'pin' };
      if(b.action === 'login') return { ok: true };
      if(b.action === 'setStatus'){ s.status = b.status; }
      else if(b.action === 'saveRoster'){
        db.candidates = (b.candidates || []).filter(c => c.name);
        ['title','subtitle','voteSeconds','countdownSeconds'].forEach(k => { if(b.config && b.config[k] !== undefined) s[k] = String(b.config[k]); });
        s.runoff = '';
      }
      else if(b.action === 'reset'){ s.round = String(+s.round + 1); s.status = 'ready'; s.runoff = ''; db.votes = []; }
      else if(b.action === 'runoff'){
        s.runoff = (b.names || []).filter(n => db.candidates.some(c => c.name === n)).join('|');
        s.round = String(+s.round + 1); s.status = 'open';
      }
      else return { ok: false, error: 'unknown action' };
      LS.set(K, db);
      return stateOf(db);
    }
  };
})();

/* ================================================================
   캐릭터 'AI 대리' — 여자 회사원 (긴 머리·블라우스·재킷·치마·귀걸이·사원증·마이크)
   ================================================================ */

let sayTimer = null;
function say(id, text, mood, calmAfter){
  const m = document.getElementById(id); if(!m) return;
  m.className = 'mascot ' + (mood || 'talk');
  const b = document.getElementById(id + 'Bubble');
  b.textContent = text || '';
  b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
  clearTimeout(sayTimer);
  if(calmAfter) sayTimer = setTimeout(() => { if(m.classList.contains('talk')) m.className = 'mascot idle'; }, calmAfter);
}

/* ================================================================
   효과음 (브라우저에서 바로 합성)
   ================================================================ */
const SND = {
  ctx: null, buf: null, muted: false,
  ensure(){
    if(!this.ctx){ const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return null; this.ctx = new AC(); }
    if(this.ctx.state === 'suspended') this.ctx.resume();
    if(!this.buf){
      const n = this.ctx.sampleRate; this.buf = this.ctx.createBuffer(1, n, n);
      const d = this.buf.getChannelData(0); for(let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    }
    return this.ctx;
  },
  ok(){ return this.ensure() && this.ctx.state === 'running'; },
  noise(at, dur, vol, type, freq){
    const c = this.ctx, src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = this.buf; f.type = type; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.001, at + dur);
    src.connect(f); f.connect(g); g.connect(c.destination); src.start(at, Math.random() * 0.5); src.stop(at + dur + 0.05);
  },
  tone(at, freq, dur, vol, type){
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type || 'triangle'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + 0.01); g.gain.exponentialRampToValueAtTime(0.001, at + dur);
    o.connect(g); g.connect(c.destination); o.start(at); o.stop(at + dur + 0.05);
  },
  drumroll(sec){
    if(!this.ok()) return; const t0 = this.ctx.currentTime;
    for(let t = 0; t < sec; t += 0.042) this.noise(t0 + t, 0.07, 0.12 + 0.45 * (t / sec), 'bandpass', 300);
    this.noise(t0 + sec, 1.6, 0.6, 'highpass', 5000); this.tone(t0 + sec, 65, 0.7, 0.6, 'sine');
  },
  tick(high){ if(!this.ok()) return; this.tone(this.ctx.currentTime, high ? 880 : 1500, 0.05, 0.14, 'sine'); },
  ding(){ if(!this.ok()) return; const t = this.ctx.currentTime; this.tone(t, 1318, 0.5, 0.16, 'sine'); this.tone(t + 0.08, 1976, 0.7, 0.12, 'sine'); },
  fanfare(){
    if(!this.ok()) return; const t = this.ctx.currentTime;
    [[392,0,.2],[523,.18,.2],[659,.36,.2],[784,.54,.9],[659,.9,.16],[784,1.04,1.4]].forEach(([f,d,l]) => { this.tone(t + d, f, l, 0.2, 'triangle'); this.tone(t + d, f * 2, l, 0.05, 'sine'); this.tone(t + d, f / 2, l, 0.08, 'sawtooth'); });
  }
};

/* ================================================================
   목소리 — 브라우저 음성 합성으로 AI 대리의 멘트를 읽음
   (여성 음성: 마이크로소프트 자연 음성 SunHi 우선 → Google 한국어(여) → Heami, 없으면 다른 한국어 음성)
   ================================================================ */
const VOICE = {
  on: true, v: null, played: false,
  ok(){ return 'speechSynthesis' in window; },   // 끄는 기능 없음: 항상 소리
  pick(){
    if(!('speechSynthesis' in window)) return null;
    const ko = speechSynthesis.getVoices().filter(v => /^ko/i.test(v.lang));
    for(const re of [/SunHi.*Natural/i, /SunHi/i, /Google/i, /Heami/i, /Yu-?Jin|JiMin|SeoHyeon|Female|여/i]){ const f = ko.find(v => re.test(v.name)); if(f) return (this.v = f); }
    return (this.v = ko[0] || null);
  },
  // 다 읽으면 끝나는 Promise. 음성이 없거나 막히면 글자 수에 맞춰 기다렸다가 끝냄
  // 자연 음성(SunHi)은 페이지가 뜬 뒤 조금 늦게 목록에 올라옴 → 처음 한 번은 최대 2.5초 기다림
  ready(){
    if(this._ready) return this._ready;
    const good = () => { const v = this.pick(); return v && /SunHi/i.test(v.name); };
    return (this._ready = new Promise(res => {
      if(good()) return res();
      const t0 = Date.now();
      const tick = () => { if(good() || Date.now() - t0 > 2500) return res(); setTimeout(tick, 150); };
      tick();
    }));
  },
  async speak(text){
    if(text && this.ok()) await this.ready();
    return new Promise(res => {
      if(!text || !this.ok()) return res();
      try { speechSynthesis.cancel(); } catch(e){}
      const u = new SpeechSynthesisUtterance(text.replace(/[·「」『』]/g, m => m === '·' ? ', ' : ''));
      if(!this.v || !/SunHi/i.test(this.v.name)) this.pick();   // 늦게 올라온 자연 음성으로 바꿔 탐
      if(this.v) u.voice = this.v;
      u.lang = 'ko-KR'; u.rate = 1.28; u.pitch = 1.08;   // 조금 빠르고 밝게
      let done = false;
      const fin = () => { if(done) return; done = true; clearTimeout(t); res(); };
      const t = setTimeout(fin, 2000 + text.length * 150);
      u.onstart = () => { VOICE.played = true; };   // 실제로 소리가 나기 시작함
      u.onend = fin; u.onerror = fin;
      speechSynthesis.speak(u);
    });
  },
  stop(){ try { speechSynthesis.cancel(); } catch(e){} }
};
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged = () => VOICE.pick(); VOICE.pick(); }

async function startVote(){
  root.innerHTML = `<div class="center-msg">${mascotHTML('vm', 'stack')}<p>불러오는 중…</p></div>`;
  let st = null, selected = null, sig = '';
  const mineKey = () => NS + 'mine:' + st.config.round;

  async function refresh(){
    try { const s = await api.state(); if(!s.ok) throw new Error(s.error); st = s; }
    catch(e){ if(!st) root.innerHTML = `<div class="center-msg">${mascotHTML('vm','stack')}<h1>연결이 안 돼요</h1><p>인터넷 연결을 확인하고 새로고침해 주세요.</p></div>`; return; }
    CAND_N = st.candidates.length || 13;
    const mine = LS.get(mineKey(), null);
    const s2 = [st.config.status, st.config.round, st.config.runoff, mine, JSON.stringify(st.candidates)].join('|');
    if(s2 !== sig){ sig = s2; draw(); }
  }
  function draw(){
    const c = st.config, cands = activeCands(st), ro = runoffNames(st).length > 0;
    document.title = c.title;
    const mine = LS.get(mineKey(), null);
    const mi = cands.findIndex(x => x.name === mine);
    if(mine && mi >= 0) return drawDone(cands[mi], mi, false);
    if(!cands.length){
      root.innerHTML = `<div class="center-msg">${mascotHTML('vm','stack')}<h1>투표 준비 중입니다</h1><p>후보 명단이 올라오면 자동으로 열려요.</p></div>`;
      say('vm', '잠시만 기다려 주세요!', 'idle'); return;
    }
    if(c.status === 'closed'){
      root.innerHTML = `<div class="center-msg">${mascotHTML('vm','stack')}<h1>투표가 마감되었습니다</h1><p>결과는 앞 화면에서 함께 확인해요.</p></div>`;
      say('vm', '참여해 주셔서 감사합니다!', 'cheer'); return;
    }
    if(selected && !cands.some(x => x.name === selected)) selected = null;
    root.innerHTML = `
      <div class="vote-wrap">
        <div class="vote-head">
          <div style="flex:1;min-width:0"><span class="eyebrow">${ro ? '결선 투표 · 1인 1표' : 'HR AI AWARDS · 1인 1표'}</span><h1 class="gold" id="voteTitle">${esc(c.title)}</h1><p>${ro ? '동점이 나와 결선 투표를 진행합니다. 한 분에게 다시 한 표를 주세요.' : esc(c.subtitle)}</p></div>
          ${mascotHTML('vm', 'stack')}
        </div>
        ${CFG.voteUrl ? '' : '<div class="warn" style="margin-bottom:14px">연습 모드: 이 브라우저 안에서만 기록됩니다.</div>'}
        <details class="crit-mini"><summary>선정 기준 ${CRITERIA.length}가지</summary>
          <ol>${CRITERIA.map((k, j) => `<li><i>${String(j + 1).padStart(2, '0')}</i><b>${esc(k[0])}</b>${esc(k[1])}</li>`).join('')}</ol></details>
        <div class="grid">
          ${cands.map((x, i) => `
            <button class="cand${x.name === selected ? ' sel' : ''}" data-i="${i}">
              <span class="num">${String(i + 1).padStart(2, '0')}</span><span class="check">✓</span>
              <div style="display:flex;gap:10px;align-items:center">${avatar(x, i)}
                <div><div class="who">${esc(x.name)}</div>${x.team ? `<div class="team">${esc(x.team)}</div>` : ''}</div></div>
              ${x.project ? `<div class="proj">${esc(x.project)}</div>` : ''}
            </button>`).join('')}
        </div>
      </div>
      <div class="dock"><div class="dock-inner"><button class="btn" id="goBtn" disabled></button></div></div>`;
    root.querySelectorAll('.cand').forEach(el => el.onclick = () => {
      selected = cands[+el.dataset.i].name;
      root.querySelectorAll('.cand').forEach(x => x.classList.toggle('sel', x === el));
      setBtn();
    });
    $('#goBtn').onclick = () => { const i = cands.findIndex(x => x.name === selected); if(i >= 0) openConfirm(cands[i], i); };
    setBtn();
    onFit = () => fitOneLine($('#voteTitle'), 28, 15);
    onFit(); if(document.fonts) document.fonts.ready.then(() => onFit && onFit());
    if(c.status === 'open') say('vm', ro ? '결선 투표예요! 한 분만 골라 주세요!' : '한 분만 골라 주세요!', 'idle');
    else say('vm', '곧 시작합니다. 미리 둘러보세요!', 'idle');
  }
  function setBtn(){
    const b = $('#goBtn'); if(!b) return;
    const open = st.config.status === 'open';
    b.classList.toggle('accent', open && !!selected);
    if(!open){ b.disabled = true; b.innerHTML = '투표 시작을 기다리는 중<span class="wait-dots"><i>.</i><i>.</i><i>.</i></span>'; }
    else if(!selected){ b.disabled = true; b.textContent = '한 명을 선택하세요'; }
    else { b.disabled = false; b.textContent = `${selected} 님에게 투표하기`; }
  }
  function openConfirm(x, i){
    const bg = document.createElement('div');
    bg.className = 'sheet-bg';
    bg.innerHTML = `<div class="sheet">${avatar(x, i)}<h2>${esc(x.name)}</h2>${x.team ? `<div class="team">${esc(x.team)}</div>` : ''}
      ${x.project ? `<div class="proj">${esc(x.project)}</div>` : ''}
      <div class="note">투표는 한 번만 할 수 있고, 바꿀 수 없어요.</div>
      <button class="btn accent" id="okBtn">이 작품에 투표할게요</button>
      <button class="btn-ghost" id="noBtn">다시 고를게요</button><div class="err" id="err"></div></div>`;
    document.body.appendChild(bg);
    bg.onclick = e => { if(e.target === bg) bg.remove(); };
    bg.querySelector('#noBtn').onclick = () => bg.remove();
    const ok = bg.querySelector('#okBtn');
    ok.onclick = async () => {
      ok.disabled = true; ok.textContent = '보내는 중…';
      try {
        const r = await api.post({ action: 'vote', device: deviceId(), choice: x.name });
        if(!r.ok){
          ok.disabled = false; ok.textContent = '다시 시도';
          bg.querySelector('#err').textContent = r.error === 'not_open' ? (r.status === 'closed' ? '투표가 이미 마감되었어요.' : '아직 투표가 시작되지 않았어요.') : '저장하지 못했어요. 다시 눌러 주세요.';
          if(r.error === 'not_open') setTimeout(() => { bg.remove(); sig = ''; refresh(); }, 1500);
          return;
        }
        LS.set(mineKey(), r.choice);
        bg.remove();
        const fi = st.candidates.findIndex(c => c.name === r.choice);
        drawDone(st.candidates[fi >= 0 ? fi : i], fi >= 0 ? fi : i, r.already);
      } catch(e){
        ok.disabled = false; ok.textContent = '다시 시도';
        bg.querySelector('#err').textContent = '전송에 실패했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.';
      }
    };
  }
  function drawDone(x, i, already){
    root.innerHTML = `<div class="done">${mascotHTML('vm', 'stack')}
      <h1 class="gold">${already ? '이미 투표하셨어요' : '투표 완료'}</h1>
      <p class="sub">${already ? '이 기기에서는 처음 고른 표만 반영돼요.' : '결과는 앞 화면에서 함께 확인해요.'}</p>
      <div class="mine">${avatar(x, i)}<div><div class="who">${esc(x.name)}</div>${x.project ? `<div class="proj">${esc(x.project)}</div>` : ''}</div></div></div>`;
    say('vm', '소중한 한 표 감사합니다!', 'cheer');
  }
  await refresh();
  setInterval(refresh, 4000);
}

/* ================================================================
   2) 발표 화면 (?result) — AI 대리가 진행, 결과는 진행자가 한 단계씩 넘김
   ================================================================ */
function trophySVG(){
  // 월계관 + 트로피 엠블럼
  const leaves = [], R = 92, CX = 150, CY = 118;
  for(let k = 0; k < 10; k++){
    const a = (118 + k * 13) * Math.PI / 180;               // 왼쪽 호: 위(118°) → 아래(235°)
    const x = CX + R * Math.cos(a), y = CY - R * Math.sin(a);
    const rot = Math.atan2(-Math.cos(a), -Math.sin(a)) * 180 / Math.PI;   // 호를 따라가는 방향
    const leaf = (lx, r) => `<ellipse cx="${lx.toFixed(1)}" cy="${y.toFixed(1)}" rx="15" ry="5.5" transform="rotate(${r.toFixed(1)} ${lx.toFixed(1)} ${y.toFixed(1)})" fill="url(#lg)"/>`;
    leaves.push(leaf(x, rot + 25), leaf(300 - x, 180 - rot - 25));                          // 왼쪽 + 거울상 오른쪽
  }
  return `<svg class="emblem" viewBox="0 0 300 230" aria-hidden="true">
    <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF1C9"/><stop offset=".5" stop-color="#E6C574"/><stop offset="1" stop-color="#9C7330"/></linearGradient></defs>
    ${leaves.join('')}
    <path d="M118 70 H182 V92 Q182 128 150 136 Q118 128 118 92 Z" fill="url(#lg)"/>
    <path d="M118 78 Q98 78 100 96 Q102 112 122 114" stroke="url(#lg)" stroke-width="6" fill="none"/>
    <path d="M182 78 Q202 78 200 96 Q198 112 178 114" stroke="url(#lg)" stroke-width="6" fill="none"/>
    <rect x="143" y="134" width="14" height="22" fill="url(#lg)"/>
    <path d="M124 166 H176 L170 156 H130 Z" fill="url(#lg)"/>

  async function after(p, pauseMs){

  // autoMs를 주면 그 시간이 지나면 저절로 넘어감 (그 전에 포인터를 누르면 바로 넘어감)
  function waitNext(label, extra, autoMs){

      if(autoMs) timer = setTimeout(go, autoMs);

    });

    // 소리 자동 바로가기로 열면 클릭 없이 목소리가 나옴. 일반 창은 한 번 눌러야 소리가 남

    let lastPoll = 0, lastN = st.total;

  /* --- 마감 카운트다운 → 완료 (여기까지는 자동, 결과 발표부터 진행자가 넘김) --- */
  async function countdown(n){

  /* --- 결과 발표: 단계마다 진행자가 넘김 --- */
  async function reveal(){
    const alive = begin();
    ctrl.innerHTML = '';
    const isRunoff = runoffNames(st).length > 0;
    const cands = activeCands(st).map((c, i) => ({ ...c, i, n: st.counts[c.name] || 0 }));
    const max = Math.max(0, ...cands.map(c => c.n));
    const endCtrl = () => {
      ctrl.innerHTML = `<button class="btn-st ghost" id="again">다시 보기</button><button class="btn-st ghost" id="home">처음 화면</button>`;

      $('#home').onclick = () => P.has('demo') ? (location.search = '?result') : lobby();
    };

    // ① 발표 멘트
    scene.innerHTML = `<div class="enter" style="text-align:center"><div class="kicker">The Results</div><div class="divider"><i></i></div><div class="say-big">이제 투표 결과를<br><span class="gold">발표하겠습니다</span></div></div>`;
    await after(talk('자, 그럼 결과 발표해 볼게요!'), 150); if(!alive()) return;

    // ② 두구두구
    scene.innerHTML = `<div class="drum-text">${'두구두구두구…'.split('').map((ch, k) => `<span class="gold" style="animation-delay:${k * 0.06}s">${ch}</span>`).join('')}</div>`;
    say('host', '두구두구두구…', 'drum');
    SND.drumroll(2.4);
    VOICE.speak('두구두구두구두구');
    await after(sleep(2600), 0); if(!alive()) return;
    if(max === 0){
      scene.innerHTML = `<div class="say-big">아직 받은 표가 없습니다</div>`;
      talk('앗, 아직 표가 하나도 없네요!'); endCtrl(); return;
    }
    await after(talk('많이 떨리시죠? 먼저 득표 현황부터 볼게요.'), 100); if(!alive()) return;

    // ③ 득표 막대 — 상위권은 같은 높이에서 멈추고 표 수를 가림
    const desc = cands.map(c => c.n).sort((a, b) => b - a);
    const cap = Math.min(max, Math.max(1, desc[Math.min(2, desc.length - 1)]));
    scene.innerHTML = `<div class="bars-scene enter"><div class="bars-head"><div class="t gold">${isRunoff ? '결선 득표 현황' : '득표 현황'}</div><div class="s">상위권의 득표 수는 마지막까지 비공개입니다</div></div><div class="bars">
      ${cands.map(c => `<div class="col" id="col${c.i}"><div class="col-n" id="num${c.i}">0</div>
        <div class="col-bg"><div class="col-bar" id="bar${c.i}"></div></div>
        <div class="col-name">${esc(c.name)}</div></div>`).join('')}</div></div>`;
    const rising = riseBars(cands, cap, alive);
    await after(Promise.all([rising, talk('표 받은 만큼 막대가 올라가요. 상위권은 아직 비밀이에요!')]), 100); if(!alive()) return;
    cands.forEach(c => { const col = $('#col' + c.i); if(col && c.n === 0) col.classList.add('zero'); });
    const veiled = cands.filter(c => c.n >= cap).length;
    const winners = cands.filter(c => c.n === max);
    await after(talk(veiled > 1 ? `상위권 ${veiled}명이 박빙이에요! 과연 최우수작은?` : '과연 최우수작은 누구일까요?', 'talk',
      veiled > 1 ? `상위권 ${veiled}명이 정말 박빙이에요! 과연 최우수작은 누구일까요?` : '과연 최우수작은 누구일까요?'), 200); if(!alive()) return;

    // 동점이면 공동 수상 대신 동점자끼리 결선 투표 (다시 동점이면 또 결선)
    if(winners.length > 1) return tieBreak(winners, max, alive, () => finalScene(winners, endCtrl, null, alive));
    finalScene(winners, endCtrl, cands.filter(c => c.n > 0), alive);
  }

  /* --- 동점 → 결선 투표 --- */
  async function tieBreak(winners, max, alive, fallback){
    stage.classList.add('focus');
    const names = winners.map(w => w.name);
    scene.innerHTML = `<div class="enter" style="text-align:center"><div class="kicker">Tie</div><div class="divider"><i></i></div>
      <div class="say-big"><span class="gold">동점입니다!</span></div>
      <div class="chips" style="justify-content:center;margin-top:3vh">${winners.map(w => `<span class="chip"><i></i>${esc(w.name)} · ${w.n}표</span>`).join('')}</div>
      <div class="lb-sub" style="margin-top:3vh">동점자끼리 결선 투표를 진행합니다</div></div>`;
    SND.ding();
    await after(talk(`${names.map(n => n + ' 님').join(', ')}이 ${max}표로 동점! 결선 투표로 정해 볼게요.`, 'cheer',
      `와, ${names.map(n => n + ' 님').join(', ')}이 ${max}표로 동점이에요! 결선 투표로 정해 볼게요. 휴대폰에서 한 번 더 투표해 주세요!`), 200); if(!alive()) return;
    if(P.has('demo')){
      // 리허설: 저장소는 그대로 두고 가짜 결선 득표로 이어서 보여 줌
      st.config.runoff = names.join('|');
      const pick = names[Math.floor(Math.random() * names.length)];
      st.counts = {}; names.forEach((n, k) => st.counts[n] = 3 + (k % 2));
      st.counts[pick] = Math.max(...Object.values(st.counts)) + 1;
      return reveal();
    }
    let r = null;
    for(let t = 0; t < 3 && !(r && r.ok); t++){ r = await admin({ action: 'runoff', names }).catch(() => null); if(!(r && r.ok)) await sleep(700); }
    if(!alive()) return;
    if(!(r && r.ok) || !runoffNames(r).length){
      // 저장소에 결선 기능이 없거나 연결이 안 되면 공동 수상으로 마무리
      say('host', '결선 투표를 못 열어서 공동 수상으로 발표할게요.', 'talk', 3000);
      await sleep(1500); if(alive()) fallback();
      return;
    }
    setState(r); voting();
  }

  /* --- 최우수작 발표 --- */
  async function finalScene(winners, endCtrl, voted, alive){
    // ④ 득표자 이름만 룰렛
    if(voted && voted.length > 1){
      stage.classList.add('focus');
      scene.innerHTML = `<div class="slot-scene enter"><div class="kicker">And the winner is</div><div class="slot-q gold">최우수작은…</div>
        <div class="slot"><div class="slot-hl"></div><div class="slot-list" id="slotList"></div></div></div>`;
      say('host', '두근두근… 돌아가요!', 'drum');
      VOICE.speak('최우수작은… 과연 누구일까요?');
      await after(spin(voted, winners[0], alive), 0); if(!alive()) return;
      await after(talk(winners.length > 1 ? '공동 수상이에요!' : '바로 이 분이에요!', 'cheer'), 150); if(!alive()) return;
    }

    // ⑤ 최우수작 + 과제
    stage.classList.add('focus');
    const one = winners.length === 1;
    scene.innerHTML = `<div class="final ${one ? '' : 'multi'}">
      ${trophySVG()}
      <div class="final-badge enter"><span class="kicker">Best AI Practice</span><b class="gold">${one ? '최우수작' : `공동 최우수작 · ${winners.length}`}</b></div>
      <div class="final-cards">${winners.map(w => `<div class="final-card enter" style="animation-delay:.25s">
        <div class="fc-name gold">${esc(w.name)}</div>${w.team ? `<div class="fc-team">${esc(w.team)}</div>` : ''}
        ${w.project ? `<div class="fc-proj"><span>AI 활용 사례</span>${esc(w.project)}</div>` : ''}
        <div class="fc-votes"><b class="gold">${w.n}</b>표</div></div>`).join('')}</div></div>`;
    SND.fanfare(); confetti();
    const w0 = winners[0];
    talk(one ? `${w0.name} 님, 축하드려요!` : '공동 최우수작! 모두 축하드려요!', 'cheer',
      one ? `올해 인사팀 에이아이 활용 최우수작의 영광은… ${w0.team ? w0.team + '파트 ' : ''}${w0.name} 님께 돌아갔어요! 축하드려요! 다 같이 큰 박수 부탁드려요!`
          : `공동 최우수작의 영광은 ${winners.map(w => w.name + ' 님').join(', ')}께 돌아갔어요! 모두 축하드려요! 다 같이 큰 박수 부탁드려요!`);
    endCtrl();
  }

  // 막대: 득표 수만큼 같은 속도로 올라가되, 상위권(cap 이상)은 cap 높이에서 멈추고 '?'로 가림
  function riseBars(cands, cap, alive){
    return new Promise(res => {
      const dur = Math.min(6500, Math.max(3000, cap * 650));
      const t0 = performance.now(); let lastK = 0;
      const frame = () => {
        if(!alive() || !document.getElementById('bar' + cands[0].i)) return res();
        const t = Math.max(0, Math.min(1, (performance.now() - t0) / dur));
        const k = t >= 1 ? cap : cap * (1 - Math.pow(1 - t, 1.4));
        cands.forEach(c => {
          const v = Math.min(c.n, k);
          $('#bar' + c.i).style.height = (v / cap * 82) + '%';
          const num = $('#num' + c.i), col = $('#col' + c.i);
          if(c.n >= cap && k >= cap - 1e-6){ num.textContent = '?'; col.classList.add('veiled'); }
          else num.textContent = Math.min(c.n, Math.floor(k + 1e-6));
        });
        if(Math.floor(k) > lastK){ lastK = Math.floor(k); SND.tick(); }
        if(t < 1) setTimeout(frame, 16); else setTimeout(res, 500);
      };
      frame();
    });
  }

  async function spin(voted, winner, alive){
    const list = $('#slotList');
    const seq = [shuffle(voted)[0]];
    const loops = Math.max(4, Math.ceil(34 / voted.length));
    for(let l = 0; l < loops; l++) seq.push(...shuffle(voted));
    const target = seq.length; seq.push(winner, ...shuffle(voted).slice(0, 2));
    list.innerHTML = seq.map(c => `<div class="slot-item">${esc(c.name)}</div>`).join('');
    const rh = list.firstElementChild.offsetHeight;
    list.style.transform = 'translateY(0px)'; void list.offsetHeight;
    list.style.transition = 'transform 5s cubic-bezier(.08,.62,.1,1)';
    list.style.transform = `translateY(${-(target - 1) * rh}px)`;
    let last = -1, done = false;
    const watch = () => {
      if(done || !alive()) return;
      const y = new DOMMatrixReadOnly(getComputedStyle(list).transform).m42;
      const idx = Math.round(-y / rh);
      if(idx !== last){ last = idx; SND.tick(); }
      requestAnimationFrame(watch);
    };
    requestAnimationFrame(watch);
    await sleep(5100); done = true;
    if(!alive() || !list.isConnected) return;
    list.children[target].classList.add('win');
  }

  /* --- 미리보기: ?result&demo — 저장소를 건드리지 않고 가짜 득표로 발표 연출만 --- */
  function demoRun(){
    if(!st.candidates.length) st.candidates = Array.from({ length: 13 }, (_, i) => ({ name: `발표자 ${i + 1}`, team: '소속', project: 'AI 활용 사례 예시' }));
    CAND_N = st.candidates.length;
    st.counts = {}; st.candidates.forEach((c, i) => st.counts[c.name] = (i * 7 + 3) % 9);
    if(P.get('tie') !== '1'){ const top = st.candidates.find(c => st.counts[c.name] === Math.max(...Object.values(st.counts))); if(top) st.counts[top.name] += 1; }  // 기본은 1명 선정 예시
    if(P.get('demo') === 'go'){ reveal(); return; }
    scene.innerHTML = `<div style="text-align:center"><div class="kicker">Rehearsal</div><div class="divider"><i></i></div><div class="say-big">발표 연출 미리보기</div><div class="lb-sub" style="margin-top:1vh">저장소에는 아무것도 기록되지 않습니다</div></div>`;
    talk(`안녕하세요, ${HOST}예요. 리허설 시작해 볼까요?`, 'talk', `안녕하세요, 에이아이 대리예요! 리허설 시작해 볼까요?`);
    waitNext('결과 발표 미리보기', '', 15000).then(reveal);   // 15초 뒤 저절로 (먼저 누르면 바로)
  }

  /* --- 꽃가루 (골드 톤) --- */
  function stopFx(){ cancelAnimationFrame(fxRAF); const cv = $('#fx'); if(cv) cv.getContext('2d').clearRect(0, 0, cv.width, cv.height); }
  function confetti(){
    stopFx();
    const cv = $('#fx'), ctx = cv.getContext('2d');
    const W = cv.width = cv.offsetWidth, H = cv.height = cv.offsetHeight;
    const colors = ['#F3DA94', '#E6C574', '#C99A45', '#FFF4D6', '#FFFFFF', '#B8893A'];
    const parts = [];
    const add = (x, y, vx, vy, k) => parts.push({ x, y, vx, vy, w: 5 + Math.random() * 6, h: 9 + Math.random() * 8, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: colors[k % colors.length] });
    for(let i = 0; i < 80; i++){ add(0, H * 0.85, 4 + Math.random() * 9, -(10 + Math.random() * 12), i); add(W, H * 0.85, -(4 + Math.random() * 9), -(10 + Math.random() * 12), i + 3); }
    const t0 = performance.now();
    const rain = setInterval(() => { for(let i = 0; i < 5; i++) add(Math.random() * W, -20, (Math.random() - .5) * 2, 2 + Math.random() * 3, i); }, 120);
    setTimeout(() => clearInterval(rain), 5000);
    const step = () => {
      ctx.clearRect(0, 0, W, H);
      for(let i = parts.length - 1; i >= 0; i--){
        const p = parts[i]; p.vy = Math.min(p.vy + 0.28, 5); p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        if(p.y > H + 30){ parts.splice(i, 1); continue; }
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2))); ctx.restore();
      }
      if(parts.length || performance.now() - t0 < 5200) fxRAF = requestAnimationFrame(step);
    };
    fxRAF = requestAnimationFrame(step);
  }
}

// "(교육) 신현미 - 과제명, (인사) 정상묵 - 과제명" 형식 읽기. 항목은 쉼표·줄바꿈으로 구분(다음 '(' 앞에서만 자름)
function parseTagged(text){
  const items = text.split(/\s*(?:,|\r?\n)\s*(?=\()/).map(s => s.trim()).filter(Boolean);
  const out = [];
  for(const it of items){
    const m = it.match(/^\(\s*([^)]*?)\s*\)\s*(.+?)\s*[-–—:]\s*(.+?)[,\s]*$/);
    if(!m) return [];          // 하나라도 형식이 다르면 이 방식은 포기
    out.push({ team: m[1], name: m[2], project: m[3] });
  }
  return out;
}

  };
  let armTimer;
  $('#resetBtn').onclick = async () => {
    const b = $('#resetBtn');
    if(!b.classList.contains('armed')){
      b.classList.add('armed'); b.textContent = '정말 지울까요? 한 번 더 누르면 초기화돼요';
      armTimer = setTimeout(() => { b.classList.remove('armed'); b.textContent = '투표 초기화 (처음부터 다시)'; }, 4000);
      return;
    }
    clearTimeout(armTimer); b.disabled = true; b.textContent = '초기화 중…';
    const r = await api.post({ action: 'reset', pin }).catch(() => ({ ok: false }));
    if(!r.ok){ b.disabled = false; b.textContent = '실패했어요. 다시 눌러 주세요'; return; }
    adminEditor(r); $('#saveMsg').textContent = '투표 기록을 지우고 처음 상태로 돌렸어요';
  };
  $('#logout').onclick = () => { LS.set(PIN_KEY, ''); adminLogin(); };
  window.onbeforeunload = () => dirty ? '' : undefined;
}

/* ================================================================ */
if(MODE === 'admin') startAdmin();
else if(MODE === 'result') startResult();
else startVote();
</script>
</body>
