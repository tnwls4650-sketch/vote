<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>과제 발표 투표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F3EE; --surface:#FFFFFF; --ink:#22201C; --ink-soft:#736C62; --ink-faint:#B5ADA1;
    --line:#E7E0D5; --accent:#E2573B; --accent-soft:#FCE6DF; --accent-ink:#5A1D10;
    --green:#2F6F4E; --green-bg:#E4F0E8; --warn:#8A5A00; --warn-bg:#FFF4D6; --danger:#B3261E;
    --font-body:'Noto Sans KR', sans-serif; --font-mono:'IBM Plex Mono', monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1B1A18; --surface:#262421; --ink:#F2EEE8; --ink-soft:#B2AA9E; --ink-faint:#776F65;
      --line:#38342F; --accent:#F07A5E; --accent-soft:#3E2620; --accent-ink:#FFD3C6;
      --green:#8FD0A8; --green-bg:#23382C; --warn:#F5D68A; --warn-bg:#3A3220; --danger:#FF8A80;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1B1A18; --surface:#262421; --ink:#F2EEE8; --ink-soft:#B2AA9E; --ink-faint:#776F65;
    --line:#38342F; --accent:#F07A5E; --accent-soft:#3E2620; --accent-ink:#FFD3C6;
    --green:#8FD0A8; --green-bg:#23382C; --warn:#F5D68A; --warn-bg:#3A3220; --danger:#FF8A80;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);}
  body{min-height:100vh;}
  button,input,textarea{font-family:inherit;}
  a{color:inherit;}

  /* ================= 캐릭터 '투투' ================= */
  .mascot{display:flex;align-items:flex-end;gap:16px;--ms:160px;}
  .mascot svg{width:var(--ms);height:auto;flex:none;overflow:visible;}
  .mascot[data-layout="stack"]{flex-direction:column-reverse;align-items:center;gap:6px;}
  .m-arm,.m-stick,.m-mouth,.m-eyes,.m-paper,.m-jump{transform-box:fill-box;}
  .m-arm-l{transform-origin:top right;} .m-arm-r{transform-origin:top left;}
  .m-stick-l{transform-origin:top left;} .m-stick-r{transform-origin:top right;}
  .m-mouth{transform-origin:center top;} .m-eyes{transform-origin:center;}
  .m-arm{transition:transform .3s;}
  .m-drum,.m-stick{display:none;}
  .mascot .m-jump{animation:m-bob 2.4s ease-in-out infinite;}
  .m-eyes{animation:m-blink 4.2s infinite;}
  .m-paper{animation:m-paper 2.8s ease-in-out infinite;}
  @keyframes m-bob{50%{transform:translateY(-6px)}}
  @keyframes m-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
  @keyframes m-paper{50%{transform:translateY(9px)}}
  .mascot.talk .m-mouth{animation:m-talk .26s ease-in-out infinite alternate;}
  .mascot.talk .m-arm-r{animation:m-wave .55s ease-in-out infinite alternate;}
  @keyframes m-talk{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
  @keyframes m-wave{from{transform:rotate(-60deg)}to{transform:rotate(-105deg)}}
  .mascot.cheer .m-arm-l{transform:rotate(105deg);} .mascot.cheer .m-arm-r{transform:rotate(-105deg);}
  .mascot.cheer .m-jump{animation:m-jump .45s ease-in-out infinite alternate;}
  @keyframes m-jump{to{transform:translateY(-20px)}}
  .mascot.drum .m-arm,.mascot.drum .m-tie{display:none;}
  .mascot.drum .m-drum,.mascot.drum .m-stick{display:inline;}
  .mascot.drum .m-stick-l{animation:m-stl .13s infinite alternate;}
  .mascot.drum .m-stick-r{animation:m-str .13s infinite alternate .065s;}
  .mascot.drum .m-jump{animation:m-shake .11s infinite alternate;}
  @keyframes m-stl{from{transform:rotate(-16deg)}to{transform:rotate(8deg)}}
  @keyframes m-str{from{transform:rotate(16deg)}to{transform:rotate(-8deg)}}
  @keyframes m-shake{to{transform:translate(1.5px,1px)}}
  .m-bubble{display:none;position:relative;background:#fff;color:#2B1B17;border-radius:22px;padding:14px 20px;font-weight:700;line-height:1.45;font-size:var(--bfs,17px);max-width:min(560px,62vw);margin-bottom:calc(var(--ms) * .5);box-shadow:0 8px 24px rgba(0,0,0,.12);word-break:keep-all;}
  .m-bubble:not(:empty){display:block;}
  .m-bubble::before{content:'';position:absolute;left:-11px;bottom:22px;border:11px solid transparent;border-right-color:#fff;border-left:0;}
  .mascot[data-layout="stack"] .m-bubble{margin-bottom:0;max-width:300px;text-align:center;}
  .mascot[data-layout="stack"] .m-bubble::before{left:50%;bottom:-10px;margin-left:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0;}
  .m-bubble.pop{animation:m-pop .35s cubic-bezier(.2,1.5,.4,1);}
  @keyframes m-pop{from{transform:scale(.7);opacity:0}}

  /* ================= 공통 (투표·관리) ================= */
  .eyebrow{font-family:var(--font-mono);font-size:13px;letter-spacing:0.08em;color:var(--accent-ink);background:var(--accent-soft);display:inline-block;padding:6px 12px;border-radius:100px;}
  .avatar{flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;}
  .warn{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.5;}
  .btn{display:block;width:100%;text-align:center;text-decoration:none;font-size:17px;font-weight:700;padding:16px;border-radius:14px;border:none;cursor:pointer;background:var(--ink);color:var(--surface);}
  .btn:disabled{background:var(--line);color:var(--ink-faint);cursor:default;}
  .btn.accent{background:var(--accent);color:#fff;}
  .btn.line{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
  .btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--line);}
  .btn.danger.armed{background:var(--danger);color:#fff;border-color:var(--danger);}
  .btn-ghost{background:transparent;color:var(--ink-soft);font-weight:500;font-size:16px;padding:12px;margin-top:4px;width:100%;border:none;cursor:pointer;}
  .err{color:var(--danger);font-size:14px;text-align:center;margin-top:8px;min-height:1em;}
  .center-msg{max-width:440px;margin:0 auto;padding:56px 16px;text-align:center;}
  .center-msg h1{font-size:26px;font-weight:900;margin:18px 0 8px;}
  .center-msg p{color:var(--ink-soft);font-size:16px;margin:0;line-height:1.6;}

  /* ================= 투표 화면 ================= */
  .vote-wrap{max-width:560px;margin:0 auto;padding:24px 16px 140px;}
  .vote-head{display:flex;gap:12px;align-items:flex-end;margin-bottom:18px;}
  .vote-head .mascot{--ms:84px;}
  .vote-head .m-bubble{font-size:13px;padding:8px 12px;max-width:150px;}
  .vote-head h1{font-size:clamp(22px,6.5vw,28px);font-weight:900;margin:10px 0 4px;line-height:1.3;}
  .vote-head p{font-size:15px;color:var(--ink-soft);margin:0;line-height:1.5;}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
  .cand{position:relative;background:var(--surface);border:2px solid transparent;border-radius:18px;padding:16px 14px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,0.04);transition:transform .12s, border-color .12s, box-shadow .12s;}
  .cand:active{transform:scale(0.98);}
  .cand.sel{border-color:var(--accent);box-shadow:0 6px 18px rgba(226,87,59,0.18);}
  .cand .num{position:absolute;top:12px;right:12px;font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--ink-faint);}
  .cand .avatar{width:42px;height:42px;font-size:17px;}
  .cand .who{font-size:17px;font-weight:700;line-height:1.25;}
  .cand .team{font-size:12.5px;color:var(--ink-soft);font-weight:500;margin-top:2px;}
  .cand .proj{font-size:14px;line-height:1.4;background:var(--bg);border-radius:10px;padding:8px 10px;font-weight:500;word-break:keep-all;}
  .cand .check{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:none;align-items:center;justify-content:center;font-size:15px;font-weight:900;}
  .cand.sel .check{display:flex;} .cand.sel .num{display:none;}
  .dock{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;justify-content:center;}
  .dock-inner{width:100%;max-width:560px;}
  .wait-dots i{display:inline-block;animation:dot 1.2s infinite;font-style:normal;}
  .wait-dots i:nth-child(2){animation-delay:.2s} .wait-dots i:nth-child(3){animation-delay:.4s}
  @keyframes dot{0%,60%,100%{opacity:.25}30%{opacity:1}}
  .sheet-bg{position:fixed;inset:0;background:rgba(20,18,15,0.45);display:flex;align-items:flex-end;justify-content:center;z-index:10;animation:fade .15s;}
  .sheet{width:100%;max-width:560px;background:var(--surface);border-radius:24px 24px 0 0;padding:26px 20px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease-out;text-align:center;}
  .sheet .avatar{width:72px;height:72px;font-size:28px;margin:0 auto 12px;}
  .sheet h2{font-size:24px;font-weight:900;margin:0 0 4px;}
  .sheet .team{color:var(--ink-soft);font-size:14px;margin-bottom:12px;}
  .sheet .proj{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:16px;font-weight:500;line-height:1.45;margin-bottom:14px;word-break:keep-all;}
  .sheet .note{font-size:14px;color:var(--ink-soft);margin-bottom:10px;}
  @keyframes fade{from{opacity:0}}
  @keyframes up{from{transform:translateY(40px);opacity:0}}
  .done{max-width:440px;margin:0 auto;padding:40px 16px;text-align:center;}
  .done .mascot{--ms:150px;justify-content:center;}
  .done h1{font-size:28px;font-weight:900;margin:18px 0 8px;}
  .done .sub{color:var(--ink-soft);font-size:16px;margin:0 0 22px;line-height:1.5;}
  .done .mine{background:var(--surface);border-radius:18px;padding:18px;display:flex;gap:14px;align-items:center;text-align:left;}
  .done .mine .avatar{width:52px;height:52px;font-size:21px;}
  .done .mine .who{font-size:18px;font-weight:700;}
  .done .mine .proj{font-size:14px;color:var(--ink-soft);margin-top:3px;line-height:1.4;}

  /* ================= 관리자 화면 ================= */
  .ad-wrap{max-width:760px;margin:0 auto;padding:28px 16px 120px;}
  .ad-wrap.narrow{max-width:400px;padding-top:60px;}
  .ad-wrap h1{font-size:28px;font-weight:900;margin:12px 0 6px;}
  .ad-sub{color:var(--ink-soft);margin:0 0 20px;}
  .ad-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;}
  .link{background:none;border:none;color:var(--ink-soft);font-size:15px;cursor:pointer;text-decoration:underline;}
  .ad-card{background:var(--surface);border-radius:20px;padding:22px 20px;margin-bottom:14px;}
  .ad-card h2{font-size:18px;margin:0 0 14px;display:flex;align-items:center;gap:8px;}
  .ad-card h2 small{font-family:var(--font-mono);font-size:13px;color:var(--ink-soft);font-weight:600;background:var(--bg);border-radius:100px;padding:3px 10px;}
  .ad-in,.ad-row input,textarea{width:100%;font-size:16px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);outline:none;}
  .ad-in:focus,.ad-row input:focus,textarea:focus{border-color:var(--accent);}
  .ad-wrap.narrow .ad-in{font-size:20px;text-align:center;letter-spacing:.3em;margin-bottom:10px;}
  .ad-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .ad-fields label{font-size:13px;color:var(--ink-soft);font-weight:500;display:flex;flex-direction:column;gap:6px;}
  .ad-fields .full{grid-column:1/-1;}
  .ad-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
  .ad-stats div{background:var(--bg);border-radius:14px;padding:14px;}
  .ad-stats b{display:block;font-size:22px;font-weight:900;}
  .ad-stats span{font-size:13px;color:var(--ink-soft);}
  .ad-links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  .ad-note{font-size:13px;color:var(--ink-soft);margin-top:8px;line-height:1.5;}
  .ad-row{display:grid;grid-template-columns:30px 1fr 1fr 36px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
  .ad-row .n{font-family:var(--font-mono);font-size:13px;color:var(--ink-faint);font-weight:600;text-align:center;}
  .ad-row .proj{grid-column:2/4;}
  .ad-row .del{width:36px;height:36px;border-radius:10px;border:none;background:var(--bg);color:var(--ink-soft);font-size:18px;cursor:pointer;}
  .ad-row input{padding:10px 12px;font-size:15px;}
  details.paste{background:var(--bg);border-radius:14px;padding:12px 14px;margin-bottom:10px;}
  details.paste summary{cursor:pointer;font-weight:700;font-size:15px;}
  details.paste p{font-size:13px;color:var(--ink-soft);margin:8px 0;}
  details.paste textarea{background:var(--surface);font-size:14px;margin-bottom:8px;}
  .ad-save{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;justify-content:center;}
  .ad-save-in{width:100%;max-width:760px;display:flex;gap:12px;align-items:center;}
  .ad-save-in span{flex:1;font-size:14px;color:var(--ink-soft);}
  .ad-save-in .btn{width:auto;padding:15px 34px;}
  .qr-mini{display:flex;gap:16px;align-items:center;background:var(--bg);border-radius:14px;padding:12px;margin-bottom:12px;}
  .qr-mini .q{background:#fff;padding:6px;border-radius:8px;flex:none;}
  .qr-mini .u{font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);word-break:break-all;}
  @media (max-width:560px){ .ad-fields{grid-template-columns:1fr;} .ad-links{grid-template-columns:1fr;} }

  /* ================= 발표 화면 (무대) ================= */
  body.mode-result{background:#1E1432;}
  .stage{position:relative;min-height:100vh;overflow:hidden;color:#FFF7EE;display:grid;grid-template-rows:auto 1fr auto;
    background:radial-gradient(ellipse 80% 60% at 50% -5%, #6A4699 0%, rgba(106,70,153,0) 70%), linear-gradient(180deg,#2C1C4A 0%,#1E1432 100%);}
  .stage::after{content:'';position:absolute;left:0;right:0;bottom:0;height:22vh;background:radial-gradient(ellipse 70% 100% at 50% 100%, rgba(255,180,90,.16), transparent 70%);pointer-events:none;}
  #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;}
  .st-top{display:flex;justify-content:space-between;align-items:center;padding:18px 28px;position:relative;z-index:2;}
  .st-title{font-weight:900;font-size:clamp(16px,1.7vw,24px);opacity:.85;}
  .st-tools{display:flex;gap:8px;}
  .pill{background:rgba(255,255,255,.1);border:none;color:#FFF7EE;border-radius:100px;padding:8px 14px;font-size:14px;cursor:pointer;text-decoration:none;}
  .st-main{position:relative;display:flex;align-items:center;justify-content:center;padding:0 28px;min-height:0;z-index:1;}
  .st-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:0 28px 22px;position:relative;z-index:6;}
  .st-host .mascot{--ms:clamp(130px,14vw,220px);--bfs:clamp(17px,1.7vw,27px);}
  .st-ctrl{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;align-items:center;}
  .btn-st{background:#FFD54F;color:#2B1B17;font-weight:900;font-size:clamp(16px,1.4vw,20px);padding:16px 28px;border-radius:16px;border:none;cursor:pointer;text-decoration:none;}
  .btn-st.ghost{background:rgba(255,255,255,.12);color:#FFF7EE;font-weight:700;}
  .btn-st:disabled{opacity:.5;cursor:default;}
  .st-pin{display:flex;gap:8px;align-items:center;}
  .st-pin input{width:150px;font-size:18px;padding:14px;border-radius:14px;border:none;text-align:center;letter-spacing:.3em;}
  .st-err{color:#FFB4A9;font-size:14px;}
  .enter{animation:enter .55s cubic-bezier(.2,.9,.3,1.2) both;}
  @keyframes enter{from{opacity:0;transform:translateY(24px) scale(.96)}}

  .lobby{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5vw;align-items:center;width:100%;max-width:1240px;}
  .lb-eyebrow{display:inline-block;font-family:var(--font-mono);font-weight:600;font-size:clamp(13px,1.1vw,16px);letter-spacing:.08em;background:rgba(255,213,79,.15);color:#FFD54F;border-radius:100px;padding:7px 14px;}
  .big-title{font-size:clamp(36px,5.2vw,80px);font-weight:900;line-height:1.2;margin:16px 0 10px;word-break:keep-all;}
  .lb-sub{font-size:clamp(17px,1.7vw,26px);opacity:.75;margin-bottom:26px;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border-radius:100px;padding:7px 14px 7px 8px;font-size:clamp(14px,1.2vw,18px);font-weight:500;}
  .chip i{width:22px;height:22px;border-radius:50%;display:inline-block;}
  .qr-card{background:#fff;border-radius:26px;padding:18px 18px 14px;text-align:center;color:#2B1B17;box-shadow:0 20px 50px rgba(0,0,0,.3);}
  .qr-card img,.qr-card canvas{display:block;margin:0 auto;}
  .qr-cap{font-weight:700;font-size:clamp(14px,1.2vw,18px);margin-top:10px;}

  .voting{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5vw;align-items:center;width:100%;max-width:1240px;}
  .live{display:inline-flex;align-items:center;gap:8px;background:#E53935;color:#fff;font-weight:900;font-family:var(--font-mono);letter-spacing:.1em;padding:6px 14px;border-radius:8px;font-size:clamp(13px,1.1vw,17px);}
  .live i{width:10px;height:10px;border-radius:50%;background:#fff;animation:blink 1s infinite;}
  @keyframes blink{50%{opacity:.2}}
  .vt-big{font-size:clamp(70px,11vw,170px);font-weight:900;line-height:1.05;margin:14px 0 6px;letter-spacing:-.02em;}
  .vt-big .d{display:inline-block;animation:hop 1.1s infinite;color:#FFD54F;}
  .vt-big .d:nth-child(2){animation-delay:.15s} .vt-big .d:nth-child(3){animation-delay:.3s}
  @keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-.18em)}}
  .vt-count{font-size:clamp(20px,2.2vw,34px);margin-bottom:22px;}
  .vt-count b{font-family:var(--font-mono);font-size:1.6em;color:#FFD54F;display:inline-block;}
  .vt-count b.bump{animation:bump .5s;}
  @keyframes bump{40%{transform:scale(1.4)}}
  .tbar{height:16px;background:rgba(255,255,255,.12);border-radius:10px;overflow:hidden;max-width:640px;}
  .tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#FF8A65,#FFD54F);border-radius:10px;transition:width .25s linear;}
  .vt-remain{font-family:var(--font-mono);font-size:clamp(15px,1.3vw,20px);opacity:.75;margin-top:10px;}
  .ballot{position:absolute;top:-60px;width:34px;height:42px;background:#fff;border-radius:5px;opacity:.85;animation:fall linear infinite;z-index:0;}
  .ballot::after{content:'';position:absolute;left:9px;top:12px;width:14px;height:8px;border-left:4px solid #4CAF50;border-bottom:4px solid #4CAF50;transform:rotate(-45deg);}
  @keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}

  .cd{text-align:center;}
  .cd-msg{font-size:clamp(28px,3.6vw,56px);font-weight:900;}
  .cd-msg b{color:#FFD54F;font-family:var(--font-mono);}
  .cd-num{font-family:var(--font-mono);font-weight:700;font-size:clamp(150px,24vw,340px);line-height:1;color:#FFD54F;text-shadow:0 0 60px rgba(255,213,79,.5);}
  .cd-num.pop{animation:cdpop .9s cubic-bezier(.2,1.4,.4,1);}
  @keyframes cdpop{from{transform:scale(1.8);opacity:0}}
  .closed-box{text-align:center;}
  .closed-check{width:clamp(110px,12vw,170px);height:clamp(110px,12vw,170px);border-radius:50%;background:#4CAF50;margin:0 auto 26px;display:flex;align-items:center;justify-content:center;animation:cdpop .6s cubic-bezier(.2,1.6,.4,1);box-shadow:0 0 0 18px rgba(76,175,80,.18);}
  .closed-check::after{content:'';width:34%;height:18%;border-left:clamp(10px,1.1vw,15px) solid #fff;border-bottom:clamp(10px,1.1vw,15px) solid #fff;transform:translateY(-15%) rotate(-45deg);}

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ================================================================
   설정 · 유틸
   ================================================================ */
const CFG = window.VOTE || {};
const P = new URLSearchParams(location.search);
const MODE = P.has('admin') ? 'admin' : (P.has('result') ? 'result' : 'vote');
const NS = 'vote2:' + (CFG.voteUrl ? CFG.voteUrl.slice(-16) : 'local') + ':';
const PIN_KEY = NS + 'pin';
const root = document.getElementById('root');
document.body.classList.add('mode-' + MODE);

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
let CAND_N = 13;
function hueColor(i){ return `hsl(${Math.round((i * 360 / Math.max(CAND_N, 1) + 12) % 360)} 62% 56%)`; }
function initial(name){ return esc(String(name).trim().charAt(0) || '?'); }
function avatar(c, i){ return `<div class="avatar" style="background:${hueColor(i)}">${initial(c.name)}</div>`; }
function voterUrl(){ return CFG.qrUrl || (location.origin + location.pathname); }
function drawQR(id, size){
  const el = document.getElementById(id);
  if(!el || !window.QRCode) return;
  el.innerHTML = '';
  new QRCode(el, { text: voterUrl(), width: size, height: size, correctLevel: QRCode.CorrectLevel.M });
}
function deviceId(){
  let id = LS.get(NS + 'device', '');
  if(!id){ id = crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2); LS.set(NS + 'device', id); }
  return id;
}

/* ================================================================
   저장소 (구글 시트 / 없으면 이 브라우저 연습 모드)
   ================================================================ */
const DEFAULTS = { title: '과제 발표 투표', subtitle: '가장 인상 깊었던 과제에 한 표를 주세요', status: 'ready', round: '1', voteSeconds: '20', countdownSeconds: '5' };
const api = CFG.voteUrl ? {
  async state(){
    const r = await fetch(CFG.voteUrl + '?t=' + Date.now(), { cache: 'no-store' });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  },
  async post(body){
    const r = await fetch(CFG.voteUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }
} : (() => {
  const K = NS + 'mockdb', PIN = '0000';
  const load = () => LS.get(K, null) || { settings: { ...DEFAULTS }, candidates: [], votes: [] };
  const stateOf = db => {
    const counts = {}; let total = 0;
    db.votes.filter(v => v.round === db.settings.round).forEach(v => { counts[v.choice] = (counts[v.choice] || 0) + 1; total++; });
    return { ok: true, config: { ...db.settings }, candidates: db.candidates, counts, total };
  };
  return {
    async state(){ return stateOf(load()); },
    async post(b){
      const db = load(), s = db.settings;
      if(b.action === 'vote'){
        if(s.status !== 'open') return { ok: false, error: 'not_open', status: s.status };
        const prev = db.votes.find(v => v.round === s.round && v.device === b.device);
        if(prev) return { ok: true, already: true, choice: prev.choice };
        if(!db.candidates.some(c => c.name === b.choice)) return { ok: false, error: 'unknown candidate' };
        db.votes.push({ round: s.round, device: b.device, choice: b.choice }); LS.set(K, db);
        return { ok: true, already: false, choice: b.choice };
      }
      if(String(b.pin) !== PIN) return { ok: false, error: 'pin' };
      if(b.action === 'login') return { ok: true };
      if(b.action === 'setStatus'){ s.status = b.status; }
      else if(b.action === 'saveRoster'){
        db.candidates = (b.candidates || []).filter(c => c.name);
        ['title','subtitle','voteSeconds','countdownSeconds'].forEach(k => { if(b.config && b.config[k] !== undefined) s[k] = String(b.config[k]); });
      }
      else if(b.action === 'reset'){ s.round = String(+s.round + 1); s.status = 'ready'; db.votes = []; }
      else return { ok: false, error: 'unknown action' };
      LS.set(K, db);
      return stateOf(db);
    }
  };
})();

/* ================================================================
   캐릭터 '투투' (투표함 친구)

  </svg>`;
}
function mascotHTML(id, layout){
  return `<div class="mascot idle" id="${id}" data-layout="${layout || 'side'}">${mascotSVG()}<div class="m-bubble" id="${id}Bubble"></div></div>`;
}
let sayTimer = null;
function say(id, text, mood, calmAfter){
  const m = document.getElementById(id); if(!m) return;
  m.className = 'mascot ' + (mood || 'talk');
  const b = document.getElementById(id + 'Bubble');
  b.textContent = text || '';
  b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
  clearTimeout(sayTimer);
  if(calmAfter) sayTimer = setTimeout(() => { if(m.classList.contains('talk')) m.className = 'mascot idle'; }, calmAfter);
}

/* ================================================================
   효과음 (브라우저에서 바로 합성)
   ================================================================ */
const SND = {
  ctx: null, buf: null, muted: false,
  ensure(){
    if(!this.ctx){ const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return null; this.ctx = new AC(); }
    if(this.ctx.state === 'suspended') this.ctx.resume();
    if(!this.buf){
      const n = this.ctx.sampleRate; this.buf = this.ctx.createBuffer(1, n, n);
      const d = this.buf.getChannelData(0); for(let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    }
    return this.ctx;
  },
  ok(){ return !this.muted && this.ensure() && this.ctx.state === 'running'; },
  noise(at, dur, vol, type, freq){
    const c = this.ctx, src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = this.buf; f.type = type; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.001, at + dur);
    src.connect(f); f.connect(g); g.connect(c.destination); src.start(at, Math.random() * 0.5); src.stop(at + dur + 0.05);
  },
  tone(at, freq, dur, vol, type){
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type || 'triangle'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + 0.01); g.gain.exponentialRampToValueAtTime(0.001, at + dur);
    o.connect(g); g.connect(c.destination); o.start(at); o.stop(at + dur + 0.05);
  },
  drumroll(sec){
    if(!this.ok()) return; const t0 = this.ctx.currentTime;
    for(let t = 0; t < sec; t += 0.042) this.noise(t0 + t, 0.07, 0.12 + 0.45 * (t / sec), 'bandpass', 320);
    this.noise(t0 + sec, 1.4, 0.7, 'highpass', 4000); this.tone(t0 + sec, 70, 0.6, 0.6, 'sine');
  },
  tick(high){ if(!this.ok()) return; this.tone(this.ctx.currentTime, high ? 880 : 1400, 0.06, 0.18, 'square'); },
  ding(){ if(!this.ok()) return; const t = this.ctx.currentTime; this.tone(t, 1046, 0.25, 0.2); this.tone(t + 0.09, 1568, 0.35, 0.18); },
  fanfare(){
    if(!this.ok()) return; const t = this.ctx.currentTime;
    [[523,0,.18],[659,.16,.18],[784,.32,.18],[1046,.48,.7],[784,.72,.12],[1046,.84,1.1]].forEach(([f,d,l]) => { this.tone(t + d, f, l, 0.22); this.tone(t + d, f / 2, l, 0.1, 'sawtooth'); });
  }
};

/* ================================================================
   1) 참가자 투표 화면
   ================================================================ */
async function startVote(){
  root.innerHTML = `<div class="center-msg">${mascotHTML('vm', 'stack')}<p>불러오는 중…</p></div>`;
  let st = null, selected = null, sig = '';
  const mineKey = () => NS + 'mine:' + st.config.round;

  async function refresh(){
    try { const s = await api.state(); if(!s.ok) throw new Error(s.error); st = s; }
    catch(e){ if(!st) root.innerHTML = `<div class="center-msg">${mascotHTML('vm','stack')}<h1>연결이 안 돼요</h1><p>인터넷 연결을 확인하고 새로고침해 주세요.</p></div>`; return; }
    CAND_N = st.candidates.length || 13;
    const mine = LS.get(mineKey(), null);
    const s2 = [st.config.status, st.config.round, mine, JSON.stringify(st.candidates)].join('|');
    if(s2 !== sig){ sig = s2; draw(); }
  }
  function draw(){
    const c = st.config, cands = st.candidates;
    document.title = c.title;
    const mine = LS.get(mineKey(), null);
    const mi = cands.findIndex(x => x.name === mine);
    if(mine && mi >= 0) return drawDone(cands[mi], mi, false);
    if(!cands.length){
      root.innerHTML = `<div class="center-msg">${mascotHTML('vm','stack')}<h1>투표 준비 중이에요</h1><p>후보 명단이 올라오면 자동으로 열려요.</p></div>`;
      say('vm', '조금만 기다려 주세요!', 'idle'); return;
    }
    if(c.status === 'closed'){
      root.innerHTML = `<div class="center-msg">${mascotHTML('vm','stack')}<h1>투표가 마감되었어요</h1><p>결과는 앞 화면에서 함께 확인해요!</p></div>`;
      say('vm', '참여해 주셔서 고마워요!', 'cheer'); return;
    }
    if(selected && !cands.some(x => x.name === selected)) selected = null;
    root.innerHTML = `
      <div class="vote-wrap">
        <div class="vote-head">
          <div style="flex:1"><span class="eyebrow">VOTE · 1인 1표</span><h1>${esc(c.title)}</h1><p>${esc(c.subtitle)}</p></div>
          ${mascotHTML('vm', 'stack')}
        </div>
        ${CFG.voteUrl ? '' : '<div class="warn" style="margin-bottom:14px">연습 모드: 이 브라우저 안에서만 기록됩니다.</div>'}
        <div class="grid">
          ${cands.map((x, i) => `
            <button class="cand${x.name === selected ? ' sel' : ''}" data-i="${i}">
              <span class="num">${String(i + 1).padStart(2, '0')}</span><span class="check">✓</span>
              <div style="display:flex;gap:10px;align-items:center">${avatar(x, i)}
                <div><div class="who">${esc(x.name)}</div>${x.team ? `<div class="team">${esc(x.team)}</div>` : ''}</div></div>
              ${x.project ? `<div class="proj">${esc(x.project)}</div>` : ''}
            </button>`).join('')}
        </div>
      </div>
      <div class="dock"><div class="dock-inner"><button class="btn" id="goBtn" disabled></button></div></div>`;
    root.querySelectorAll('.cand').forEach(el => el.onclick = () => {
      selected = cands[+el.dataset.i].name;
      root.querySelectorAll('.cand').forEach(x => x.classList.toggle('sel', x === el));
      setBtn();
    });
    $('#goBtn').onclick = () => { const i = cands.findIndex(x => x.name === selected); if(i >= 0) openConfirm(cands[i], i); };
    setBtn();
    if(c.status === 'open') say('vm', '한 명만 골라 주세요!', 'idle');
    else say('vm', '곧 시작해요. 미리 둘러보세요!', 'idle');
  }
  function setBtn(){
    const b = $('#goBtn'); if(!b) return;
    const open = st.config.status === 'open';
    b.classList.toggle('accent', open && !!selected);
    if(!open){ b.disabled = true; b.innerHTML = '투표 시작을 기다리는 중<span class="wait-dots"><i>.</i><i>.</i><i>.</i></span>'; }
    else if(!selected){ b.disabled = true; b.textContent = '한 명을 선택하세요'; }
    else { b.disabled = false; b.textContent = `${selected} 님에게 투표하기`; }
  }
  function openConfirm(x, i){
    const bg = document.createElement('div');
    bg.className = 'sheet-bg';
    bg.innerHTML = `<div class="sheet">${avatar(x, i)}<h2>${esc(x.name)}</h2>${x.team ? `<div class="team">${esc(x.team)}</div>` : ''}
      ${x.project ? `<div class="proj">${esc(x.project)}</div>` : ''}
      <div class="note">투표는 한 번만 할 수 있고, 바꿀 수 없어요.</div>
      <button class="btn accent" id="okBtn">이 과제에 투표할게요</button>
      <button class="btn-ghost" id="noBtn">다시 고를게요</button><div class="err" id="err"></div></div>`;
    document.body.appendChild(bg);
    bg.onclick = e => { if(e.target === bg) bg.remove(); };
    bg.querySelector('#noBtn').onclick = () => bg.remove();
    const ok = bg.querySelector('#okBtn');
    ok.onclick = async () => {
      ok.disabled = true; ok.textContent = '보내는 중…';
      try {

    ctrl.innerHTML = `<button class="btn-st ghost" id="reload">명단 새로고침</button><button class="btn-st" id="goVote">투표 시작 ▶</button>`;

  async function voting(){

  /* --- 마감 카운트다운 → 완료 --- */
  async function countdown(n){
    const id = ++runId, alive = () => id === runId;
    ctrl.innerHTML = '';
    scene.innerHTML = `<div class="cd"><div class="cd-msg"><b id="cdS">${n}</b>초 뒤에 투표가 완료됩니다</div><div class="cd-num" id="cdNum">${n}</div></div>`;
    say('host', '곧 투표가 마감돼요! 아직 안 하신 분, 서둘러 주세요!', 'talk');
    for(let k = n; k >= 1; k--){
      if(!alive()) return;
      $('#cdS').textContent = k;
      const el = $('#cdNum'); el.textContent = k; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
      SND.tick(true);
      await sleep(1000);
    }
    if(!alive()) return;
    let r = null;
    for(let t = 0; t < 3 && !(r && r.ok); t++){ r = await admin({ action: 'setStatus', status: 'closed' }).catch(() => null); if(!(r && r.ok)) await sleep(700); }
    if(r && r.ok) setState(r); else { try { setState(await api.state()); } catch(e){} }
    if(!alive()) return;
    scene.innerHTML = `<div class="closed-box"><div class="closed-check"></div><div class="say-big">투표가 <em>완료</em>되었습니다!</div></div>`;

  /* --- 결과 발표 --- */
  async function reveal(){
    const id = ++runId, alive = () => id === runId;
    stopFx(); ctrl.innerHTML = '';
    const cands = st.candidates.map((c, i) => ({ ...c, i, n: st.counts[c.name] || 0 }));
    const max = Math.max(0, ...cands.map(c => c.n));
    const endCtrl = () => {
      ctrl.innerHTML = `<button class="btn-st ghost" id="again">다시 보기</button><button class="btn-st ghost" id="home">처음 화면</button>`;
      $('#again').onclick = () => P.has('demo') ? reveal() : refreshThen(reveal);
      $('#home').onclick = () => P.has('demo') ? location.search = '?result' : lobby();
    };

    // ① 발표 멘트
    scene.innerHTML = `<div class="say-big enter">이제 투표 결과를<br><em>발표하겠습니다.</em></div>`;
    say('host', '이제 투표 결과를 발표하겠습니다!', 'talk');
    await sleep(3300); if(!alive()) return;

    // ② 두구두구
    scene.innerHTML = `<div class="drum-text">${'두구두구두구'.split('').map((ch, k) => `<span style="animation-delay:${k * 0.06}s">${ch}</span>`).join('')}<span style="animation-delay:.36s">…</span></div>`;
    say('host', '두구두구두구…', 'drum');
    SND.drumroll(3.2);
    await sleep(3600); if(!alive()) return;

    if(max === 0){
      scene.innerHTML = `<div class="say-big">아직 받은 표가 없어요</div>`;
      say('host', '앗, 투표가 하나도 없네요!', 'talk', 3000); endCtrl(); return;
    }

    // ③ 득표수대로 막대 올라가기
    scene.innerHTML = `<div class="bars-scene enter"><div class="bars-head">득표 결과</div><div class="bars">
      ${cands.map(c => `<div class="col" id="col${c.i}"><div class="col-n" id="num${c.i}">0</div>
        <div class="col-bg"><div class="col-bar" id="bar${c.i}" style="background:${hueColor(c.i)}"></div></div>
        <div class="col-name">${esc(c.name)}</div></div>`).join('')}</div></div>`;
    say('host', '득표수를 공개합니다! 쭉쭉 올라가요~', 'talk');
    await riseBars(cands, max, alive); if(!alive()) return;
    const winners = cands.filter(c => c.n === max);
    cands.forEach(c => { const col = $('#col' + c.i); if(c.n === max) col.classList.add('lead'); if(c.n === 0) col.classList.add('zero'); });
    say('host', winners.length > 1 ? '오! 동점이 나왔어요!' : '과연 1위는 누구일까요?', 'talk');
    await sleep(2800); if(!alive()) return;

    // ④ 득표자 이름만 룰렛
    const voted = cands.filter(c => c.n > 0);
    if(voted.length > 1){
      scene.innerHTML = `<div class="slot-scene enter"><div class="slot-q">1위는 과연…?</div>
        <div class="slot"><div class="slot-hl"></div><div class="slot-list" id="slotList"></div></div></div>`;
      say('host', '두근두근… 돌려 돌려!', 'drum');
      await spin(voted, winners[0], alive); if(!alive()) return;
      await sleep(1000); if(!alive()) return;
    }

    // ⑤ 최종 득표자 + 과제
    const one = winners.length === 1;
    scene.innerHTML = `<div class="final ${one ? '' : 'multi'}">
      <div class="final-badge enter">${one ? '최종 1위' : `공동 1위 · ${winners.length}명`}</div>
      <div class="final-cards">${winners.map(w => `<div class="final-card enter">
        <div class="fc-av" style="background:${hueColor(w.i)}">${initial(w.name)}</div>
        <div class="fc-name">${esc(w.name)}</div>${w.team ? `<div class="fc-team">${esc(w.team)}</div>` : ''}
        ${w.project ? `<div class="fc-proj"><span>과제</span>${esc(w.project)}</div>` : ''}
        <div class="fc-votes"><b>${w.n}</b> 표</div></div>`).join('')}</div></div>`;
    SND.fanfare(); confetti();
    say('host', one ? `${winners[0].name} 님, 축하합니다!` : '공동 1위! 모두 축하합니다!', 'cheer');
    endCtrl();
  }

  function riseBars(cands, max, alive){
    return new Promise(res => {
      const dur = Math.min(7000, Math.max(3200, max * 500));
      const t0 = performance.now(); let lastK = 0;
      const frame = () => {
        if(!alive()) return res();
        const t = Math.max(0, Math.min(1, (performance.now() - t0) / dur));
        const k = t >= 1 ? max : max * (1 - Math.pow(1 - t, 1.5));
        cands.forEach(c => {
          const v = Math.min(c.n, k);
          $('#bar' + c.i).style.height = (v / max * 100) + '%';
          $('#num' + c.i).textContent = Math.min(c.n, Math.floor(k + 1e-6));
        });
        if(Math.floor(k) > lastK){ lastK = Math.floor(k); SND.tick(); }
        if(t < 1) setTimeout(frame, 16); else setTimeout(res, 500);
      };
      frame();
    });
  }

  async function spin(voted, winner, alive){
    const list = $('#slotList');
    const seq = [shuffle(voted)[0]];
    const loops = Math.max(4, Math.ceil(34 / voted.length));
    for(let l = 0; l < loops; l++) seq.push(...shuffle(voted));
    const target = seq.length; seq.push(winner, ...shuffle(voted).slice(0, 2));
    list.innerHTML = seq.map(c => `<div class="slot-item">${esc(c.name)}</div>`).join('');
    const rh = list.firstElementChild.offsetHeight;
    list.style.transform = 'translateY(0px)'; void list.offsetHeight;
    list.style.transition = 'transform 6.5s cubic-bezier(.08,.62,.1,1)';
    list.style.transform = `translateY(${-(target - 1) * rh}px)`;
    let last = -1, done = false;
    const watch = () => {
      if(done || !alive()) return;
      const y = new DOMMatrixReadOnly(getComputedStyle(list).transform).m42;
      const idx = Math.round(-y / rh);
      if(idx !== last){ last = idx; SND.tick(); }
      requestAnimationFrame(watch);
    };
    requestAnimationFrame(watch);
    await sleep(6600); done = true;
    if(!alive()) return;
    list.children[target].classList.add('win');
    say('host', '바로바로…!', 'cheer');
  }

  /* --- 미리보기: ?result&demo — 저장소를 건드리지 않고 가짜 득표로 발표 연출만 재생 --- */
  function demoRun(){
    if(!st.candidates.length) st.candidates = Array.from({ length: 13 }, (_, i) => ({ name: `발표자 ${i + 1}`, team: '소속', project: '과제명 예시' }));
    CAND_N = st.candidates.length;
    st.counts = {}; st.candidates.forEach((c, i) => st.counts[c.name] = (i * 7 + 3) % 9);
    const step = P.get('demo');
    if(step === 'final' || step === 'bars'){ reveal(); return; }
    scene.innerHTML = `<div class="say-big">발표 연출 미리보기<br><em style="font-size:.5em">저장소에는 아무것도 기록되지 않아요</em></div>`;
    say('host', '안녕하세요, 투투예요! 리허설을 시작해 볼까요?', 'talk');
    ctrl.innerHTML = `<button class="btn-st" id="demoGo">결과 발표 미리보기 ▶</button>`;
    $('#demoGo').onclick = () => { SND.ensure(); reveal(); };
  }

  /* --- 꽃가루 --- */

  function stopFx(){ cancelAnimationFrame(fxRAF); const cv = $('#fx'); if(cv) cv.getContext('2d').clearRect(0, 0, cv.width, cv.height); }
  function confetti(){
    stopFx();
    const cv = $('#fx'), ctx = cv.getContext('2d');
    const W = cv.width = cv.offsetWidth, H = cv.height = cv.offsetHeight;
    const colors = ['#FFD54F', '#FF8A65', '#4FC3F7', '#81C784', '#F06292', '#BA68C8', '#FFFFFF'];
    const parts = [];
    const add = (x, y, vx, vy, k) => parts.push({ x, y, vx, vy, w: 7 + Math.random() * 7, h: 10 + Math.random() * 8, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: colors[k % colors.length] });
    for(let i = 0; i < 90; i++){ add(0, H * 0.85, 4 + Math.random() * 9, -(10 + Math.random() * 12), i); add(W, H * 0.85, -(4 + Math.random() * 9), -(10 + Math.random() * 12), i + 3); }
    const t0 = performance.now();
    const rain = setInterval(() => { for(let i = 0; i < 6; i++) add(Math.random() * W, -20, (Math.random() - .5) * 2, 2 + Math.random() * 3, i); }, 120);
    setTimeout(() => clearInterval(rain), 5000);
    const step = now => {
      ctx.clearRect(0, 0, W, H);
      for(let i = parts.length - 1; i >= 0; i--){
        const p = parts[i]; p.vy = Math.min(p.vy + 0.28, 6); p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        if(p.y > H + 30){ parts.splice(i, 1); continue; }
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2))); ctx.restore();
      }
      if(parts.length || performance.now() - t0 < 5200) fxRAF = requestAnimationFrame(step);
    };
    fxRAF = requestAnimationFrame(step);
  }
}

  root.innerHTML = `<div class="ad-wrap narrow">
    <span class="eyebrow">관리자</span><h1>관리자 PIN</h1>
    <p class="ad-sub">후보 명단을 넣고 투표를 관리하는 화면이에요.${CFG.voteUrl ? '' : ' (연습 모드 PIN: 0000)'}</p>
    <input id="pinIn" class="ad-in" type="password" inputmode="numeric" placeholder="PIN" autofocus>
    <button class="btn accent" id="pinGo">들어가기</button><div class="err" id="pinErr">${esc(msg || '')}</div></div>`;
  const go = async () => {
    const v = $('#pinIn').value.trim(); if(!v) return;
    $('#pinGo').disabled = true;
    const r = await api.post({ action: 'login', pin: v }).catch(() => ({ ok: false, error: 'net' }));
    if(r.ok){ LS.set(PIN_KEY, v); startAdmin(); }
    else adminLogin(r.error === 'pin' ? 'PIN이 맞지 않아요' : '연결이 안 돼요. 다시 시도해 주세요');
  };
  $('#pinGo').onclick = go; $('#pinIn').onkeydown = e => { if(e.key === 'Enter') go(); };
}
function adminEditor(st){
  const pin = LS.get(PIN_KEY, '');
  let rows = st.candidates.map(c => ({ ...c }));
  if(!rows.length) rows = Array.from({ length: 13 }, () => ({ name: '', team: '', project: '' }));
  let dirty = false;
  const c = st.config;
  const statusLabel = s => ({ ready: '시작 전', open: '투표중', closed: '마감' }[s] || s);
  root.innerHTML = `<div class="ad-wrap">
    <div class="ad-head"><div><span class="eyebrow">관리자</span><h1>투표 관리</h1></div><button class="link" id="logout">로그아웃</button></div>
    ${CFG.voteUrl ? '' : '<div class="warn" style="margin-bottom:14px">연습 모드: 이 브라우저에만 저장돼요.</div>'}
    <section class="ad-card"><h2>진행 상태</h2>
      <div class="ad-stats"><div><b>${statusLabel(c.status)}</b><span>상태</span></div><div><b>${st.total}표</b><span>지금까지 참여</span></div><div><b>${esc(c.round)}회차</b><span>투표 회차</span></div></div>
      <div class="qr-mini"><div class="q" id="qrMini"></div><div><b style="font-size:14px">참가자용 QR</b><div class="u">${esc(voterUrl())}</div></div></div>
      <div class="ad-links"><a class="btn" href="?result" target="_blank">발표 화면 열기</a><a class="btn line" href="./" target="_blank">참가자 화면 열기</a></div>
      <button class="btn danger" id="resetBtn">투표 초기화 (처음부터 다시)</button>
      <div class="ad-note">리허설 뒤에 누르세요. 투표 기록을 모두 지우고 '시작 전' 상태로 돌아가요. 명단은 그대로예요.</div>
    </section>
    <section class="ad-card"><h2>기본 정보</h2>
      <div class="ad-fields">
        <label class="full">제목<input class="ad-in" id="fTitle" value="${esc(c.title)}"></label>
        <label class="full">안내 문구<input class="ad-in" id="fSub" value="${esc(c.subtitle)}"></label>
        <label>투표 시간 (초)<input class="ad-in" id="fVote" type="number" min="5" value="${esc(c.voteSeconds)}"></label>
        <label>마감 카운트다운 (초)<input class="ad-in" id="fCd" type="number" min="1" max="10" value="${esc(c.countdownSeconds)}"></label>
      </div>
      <div class="ad-note">투표 시간이 끝나면 "○초 뒤에 투표가 완료됩니다" 카운트다운 후 마감돼요. 발표 화면에서 +30초 / 바로 마감도 할 수 있어요.</div>
    </section>
    <section class="ad-card"><h2>후보 명단 <small id="cnt"></small></h2>
      <details class="paste"><summary>엑셀에서 한 번에 붙여넣기</summary>
        <p>엑셀에서 <b>성명 · 소속 · 과제명</b> 세 칸을 범위로 복사해 아래에 붙여넣으세요. 한 줄에 한 명. (두 칸이면 성명 · 과제명으로 읽어요)</p>
        <textarea id="pasteIn" rows="6" placeholder="홍길동	영업1팀	과제명…"></textarea>
        <button class="btn" id="pasteGo">표에 넣기 (지금 명단을 바꿉니다)</button></details>
      <div id="rows"></div>
      <button class="btn line" id="addRow" style="margin-top:12px">+ 한 명 추가</button>
      ${c.status === 'open' ? '<div class="warn" style="margin-top:12px">지금 투표중이에요. 이름을 바꾸면 그 사람이 받은 표가 집계에서 빠질 수 있어요.</div>' : ''}
    </section>
    <div class="ad-save"><div class="ad-save-in"><span id="saveMsg"></span><button class="btn accent" id="saveBtn">저장하기</button></div></div>
  </div>`;
  if(window.QRCode) new QRCode($('#qrMini'), { text: voterUrl(), width: 96, height: 96 });

  const markDirty = () => { dirty = true; $('#saveMsg').textContent = '저장하지 않은 변경이 있어요'; };
  const count = () => { $('#cnt').textContent = rows.filter(r => r.name.trim()).length + '명'; };
  function drawRows(){
    $('#rows').innerHTML = rows.map((r, i) => `<div class="ad-row">
      <div class="n">${i + 1}</div>
      <input data-i="${i}" data-k="name" placeholder="성명" value="${esc(r.name)}">
      <input data-i="${i}" data-k="team" placeholder="소속" value="${esc(r.team)}">
      <button class="del" data-del="${i}" title="삭제">×</button>
      <div></div><input class="proj" data-i="${i}" data-k="project" placeholder="과제명" value="${esc(r.project)}">
    </div>`).join('');
    count();
    $('#rows').querySelectorAll('input').forEach(el => el.oninput = () => { rows[+el.dataset.i][el.dataset.k] = el.value; count(); markDirty(); });
    $('#rows').querySelectorAll('[data-del]').forEach(el => el.onclick = () => { rows.splice(+el.dataset.del, 1); drawRows(); markDirty(); });
  }
  drawRows();
  ['#fTitle', '#fSub', '#fVote', '#fCd'].forEach(s => $(s).oninput = markDirty);
  $('#addRow').onclick = () => { rows.push({ name: '', team: '', project: '' }); drawRows(); markDirty(); $('#rows').lastElementChild.querySelector('input').focus(); };
  $('#pasteGo').onclick = () => {
    const lines = $('#pasteIn').value.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const parsed = lines.map(l => l.includes('\t') ? l.split('\t') : l.split(',')).map(a => a.map(x => x.trim()))
      .filter(a => a[0] && !/^(성명|이름)$/.test(a[0]))
      .map(a => a.length >= 3 ? { name: a[0], team: a[1], project: a.slice(2).join(' ').trim() } : { name: a[0], team: '', project: a[1] || '' });
    if(!parsed.length){ $('#saveMsg').textContent = '붙여넣은 내용을 읽지 못했어요'; return; }
    rows = parsed; drawRows(); dirty = true; $('#pasteIn').value = '';
    $('#saveMsg').textContent = `${parsed.length}명을 표에 넣었어요. 저장하기를 눌러 주세요.`;
  };
  $('#saveBtn').onclick = async () => {
    const clean = rows.map(r => ({ name: r.name.trim(), team: r.team.trim(), project: r.project.trim() })).filter(r => r.name);
    const names = clean.map(r => r.name), dup = names.find((n, i) => names.indexOf(n) !== i);
    if(dup){ $('#saveMsg').textContent = `'${dup}' 이름이 두 번 있어요. 구분되게 바꿔 주세요.`; return; }
    const b = $('#saveBtn'); b.disabled = true; b.textContent = '저장 중…';
    const r = await api.post({ action: 'saveRoster', pin, candidates: clean,
      config: { title: $('#fTitle').value.trim() || DEFAULTS.title, subtitle: $('#fSub').value.trim(), voteSeconds: $('#fVote').value || '20', countdownSeconds: $('#fCd').value || '5' } }).catch(() => ({ ok: false }));
    b.disabled = false; b.textContent = '저장하기';
    if(r.error === 'pin'){ LS.set(PIN_KEY, ''); return adminLogin('PIN을 다시 넣어 주세요'); }
    if(!r.ok){ $('#saveMsg').textContent = '저장하지 못했어요. 다시 눌러 주세요.'; return; }
    dirty = false; adminEditor(r); $('#saveMsg').textContent = `저장했어요 · ${clean.length}명`;
  };
  let armTimer;
  $('#resetBtn').onclick = async () => {
    const b = $('#resetBtn');
    if(!b.classList.contains('armed')){
      b.classList.add('armed'); b.textContent = '정말 지울까요? 한 번 더 누르면 초기화돼요';
      armTimer = setTimeout(() => { b.classList.remove('armed'); b.textContent = '투표 초기화 (처음부터 다시)'; }, 4000);
      return;
    }
    clearTimeout(armTimer); b.disabled = true; b.textContent = '초기화 중…';
    const r = await api.post({ action: 'reset', pin }).catch(() => ({ ok: false }));
    if(!r.ok){ b.disabled = false; b.textContent = '실패했어요. 다시 눌러 주세요'; return; }
    adminEditor(r); $('#saveMsg').textContent = '투표 기록을 지우고 처음 상태로 돌렸어요';
  };
  $('#logout').onclick = () => { LS.set(PIN_KEY, ''); adminLogin(); };
  window.onbeforeunload = () => dirty ? '' : undefined;
}

/* ================================================================ */
if(MODE === 'admin') startAdmin();
else if(MODE === 'result') startResult();
else startVote();
</script>
</body>
</html>
